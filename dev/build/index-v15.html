/* ===== Crochet Studio theme: lavender, aqua & pink (light + dark) ===== */
:root{color-scheme:only light;--ground:#F3EEFF;--card:#FFFFFF;--card2:#FCFAFF;--lav:#C9B5EE;--lav-soft:#EDE6FA;--lav-line:#D9CDEF;--lav-deep:#8D6CCB;--ink:#2E1F47;--ink2:#5B4782;--ink3:#6B5A8A;--hero-ink:#4A3570;--eyebrow:#6B5596;--aqua:#9FD6E0;--aqua-ring:#2F7F8C;--aqua-ink:#123F46;--alt-bg:#DDF2F5;--alt-ink:#123F46;--alt-ring:#9FD6E0;--pink:#B23A62;--pink-ink:#8E2A4C;--pink-soft:#FCE3EA;--pink-soft-ink:#9A2040;--gold-soft:#FFF6E5;--gold-ink:#6B4A10;--good:#1F7A3D;--bad:#B42828;--ok-bg:#E3F5EC;--ok-ink:#1E5B3A;--badge:#FFFFFF;--glass:rgba(255,255,255,.65);--shadow:rgba(74,53,112,.08);--shadow2:rgba(74,53,112,.18);--toast-bg:#2E1F47;--toast-ink:#FFFFFF;--tp-bg:#FCE3EA;--tp:#9C2F52;--ta-bg:#DDF2F5;--ta:#1F6A76;--tl-bg:#E9E0FB;--tl:#5B3F8C;--tg-bg:#FFF0D6;--tg:#8A5A12;--thumb-ico:#A893CF;--display:'Calistoga',Georgia,serif;font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--ground)}

.addr-credit{color:var(--ink3)}
.vbar{background:var(--lav);border:0;color:var(--ink)}.vbar span{color:var(--ink2)}#viewer{background:#221C2E}.vmsg{background:var(--card);color:var(--ink)}
.stat.good{color:var(--good)}.stat.bad{color:var(--bad)}.neg{color:var(--bad)}.pos{color:var(--good)}.wide{grid-column:1/-1}
.bar{height:12px;background:var(--lav-soft);border-radius:10px;overflow:hidden}.bar>div{height:100%;background:var(--aqua);border-radius:10px}

.matcard{gap:12px}

function comboMatches(o,q){let ql=q.toLowerCase(),words=ql.split(/\s+/).filter(Boolean);let hits=o.source().filter(it=>{let hay=(it.label+' '+(it.search||'')).toLowerCase();return words.every(w=>hay.includes(w))});hits.sort((a,b)=>(a.label.toLowerCase().startsWith(ql)?0:1)-(b.label.toLowerCase().startsWith(ql)?0:1)||a.label.localeCompare(b.label));return hits.slice(0,8)}
function comboOpen(fid){let o=combos[fid],inp=$(fid),list=$(fid+'List');if(!o||!inp||!list)return;let q=inp.value.trim();if(o.currentLabel&&q&&q===o.currentLabel())q='';o.items=comboMatches(o,q);let exact=o.items.some(it=>it.label.toLowerCase()===q.toLowerCase());let html=o.items.map((it,i)=>`<button type="button" role="option" onmousedown="event.preventDefault()" onclick="comboPick('${fid}',${i})">${it.photo?`<img src="${it.photo}" alt="">`:''}<span class="grow"><span class="combo-main">${esc(it.label)}</span>${it.sub?`<span class="combo-sub">${esc(it.sub)}</span>`:''}</span></button>`).join('');if(o.onNew&&q&&!exact)html+=`<button type="button" class="combo-new" onmousedown="event.preventDefault()" onclick="comboNew('${fid}')">+ Add “${esc(q)}” as new</button>`;if(!html&&o.emptyText&&document.activeElement===inp)html=`<div class="combo-empty">${esc(o.emptyText)}</div>`;list.innerHTML=html;list.classList.toggle('hidden',!html);inp.setAttribute('aria-expanded',String(!!html))}
function comboPick(fid,i){let o=combos[fid],it=o?.items?.[i];if(!it)return;$(fid).value=it.value??it.label;comboClose(fid);o.onPick?.(it)}
function comboNew(fid){let o=combos[fid],q=$(fid).value.trim();comboClose(fid);o?.onNew?.(q)}
function comboClose(fid){$(fid+'List')?.classList.add('hidden');$(fid)?.setAttribute('aria-expanded','false')}
function comboBlur(fid){setTimeout(()=>{comboClose(fid);let o=combos[fid],inp=$(fid);if(o?.onCommit&&inp&&document.activeElement!==inp)o.onCommit(inp.value.trim())},180)}

function marketTodo(){let m=curMarket();if(!m)return '<p>Market not found.</p>';m.todos||=[];let t=m.todos,done=t.filter(x=>x.done).length,pct=t.length?Math.round(done/t.length*100):0,have=new Set(t.map(x=>x.text.toLowerCase())),sugg=TODO_SUGGESTIONS.filter(x=>!have.has(x.toLowerCase()));return `${backBtn()}<div class="panel" style="margin-top:12px"><h2 style="margin-bottom:2px">To-do list</h2><div class="muted">${esc(m.name)} · ${marketDateLine(m)}</div>${t.length?`<div class="row" style="font-size:13px;font-weight:700;margin:14px 0 6px"><span>${done===t.length?'Checklist complete ✓':`${done} of ${t.length} done`}</span><span>${pct}%</span></div><div class="bar"><div style="width:${pct}%"></div></div>`:''}<div class="todo-list">${t.map(x=>`<div class="todo ${x.done?'done':''}"><label><input type="checkbox" ${x.done?'checked':''} onchange="toggleTodo('${x.id}')"><span>${esc(x.text)}</span></label><button class="iconbtn sm" aria-label="Delete ${esc(x.text)}" onclick="deleteTodo('${x.id}')">${ic('x',16)}</button></div>`).join('')||'<p class="muted" style="margin:14px 0 4px">Nothing on the list yet.</p>'}</div><label for="todoText">Add a to-do</label><div class="row"><input id="todoText" placeholder="e.g. Pick up extra bags" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();addTodo()}"><button onclick="addTodo()">Add</button></div>${sugg.length?`<div class="hint" style="margin-top:14px;font-weight:700">Quick add</div><div class="actions" style="margin-top:6px">${sugg.map(x=>`<button class="alt small" onclick="addTodo(${esc(JSON.stringify(x))})">+ ${esc(x)}</button>`).join('')}</div>`:''}${done?`<div class="actions"><button class="danger small" onclick="clearDoneTodos()">Clear checked items</button></div>`:''}</div><div class="panel"><h3><label for="todoNotes" style="font:inherit;color:inherit;margin:0">Notes</label></h3><textarea id="todoNotes" rows="7" placeholder="Parking, load-in time, contact person, what sold well last time…" oninput="s function addTodo(text){let m=curMarket();if(!m)return;let typed=text===undefined;text=normName(typed?$('todoText')?.value:text);if(!text){$('todoText')?.focus();return}m.todos||=[];m.todos.push({id:id(),text,done:false});save();render()}

async function clearDoneTodos(){let m=curMarket();if(!m||!await appConfirm('Remove all checked items from this list?'))return;m.todos=(m.todos||[]).filter(x=>!x.done);save();render()}
let notesTimer=null;function saveTodoNotes(v){let m=curMarket();if(!m)return;m.notes=v;let h=$('notesSaved');if(h)h.textContent='Saving…';clearTimeout(notesTimer);notesTimer=setTimeout(()=>{save();let h=$('notesSaved');if(h)h.textContent='Saved ✓'},500)}
function marketFigures(ms){let ids=new Set(ms.map(m=>m.id)),sales=data.sales.filter(x=>ids.has(x.marketId));let revenue=sales.reduce((a,x)=>a+num(x.qty)*num(x.price),0),materials=sales.reduce((a,x)=>a+num(x.qty)*num(x.estimatedMaterialCost),0),qty=sales.reduce((a,x)=>a+num(x.qty),0),booth=ms.reduce((a,m)=>a+num(m.cost),0);return {revenue,materials,qty,booth,profit:revenue-materials-booth,sales}}

async function completeMarket(mid){let m=data.markets.find(x=>x.id===mid);if(!m)return;let left=Object.values(m.items||{}).reduce((a,q)=>a+num(q),0);if(!await appConfirm(`Mark ${m.name} as completed?\n\nIts sales and booth cost will be added to Reports.${left?`\n${left} unsold item${left>1?'s':''} will go back to your available stock.`:''}`))return;m.completed=true;m.completedAt=new Date().toISOString();m.packedAtCompletion={...(m.items||{})};m.items={};marketSaleMode=false;marketSaleDraft={};save();render();scrollTo(0,0);toast(`${m.name} completed and added to Reports.`)}

let addrTimer=null,addrSeq=0,geoBiasPromise=null;
function getGeoBias(){if(!geoBiasPromise)geoBiasPromise=new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude.toFixed(3),lon:p.coords.longitude.toFixed(3)}),()=>res(null),{timeout:8000,maximumAge:864e5,enableHighAccuracy:false})});return geoBiasPromise}

function formatPlace(f){let p=f.properties||{},street=[p.housenumber,p.street].filter(Boolean).join(' '),city=p.city||p.town||p.village||p.district||p.county;let parts=[p.name&&p.name!==street?p.name:'',street,city,p.state,p.postcode].filter(Boolean);return [...new Set(parts)].join(', ')}
async function fetchAddr(fid,q){let seq=++addrSeq;let bias=await getGeoBias();if(seq!==addrSeq)return;let u='https://photon.komoot.io/api/?limit=6&lang=en&q='+encodeURIComponent(q)+(bias?`&lat=${bias.lat}&lon=${bias.lon}`:'');try{let r=await fetch(u);if(!r.ok)throw new Error(r.status);let j=await r.json();if(seq!==addrSeq)return;let items=[...new Set((j.features||[]).map(formatPlace).filter(Boolean))].slice(0,5),list=$(fid+'List');if(!list)return;if(!items.length)return hideAddr(fid);list.innerHTML=items.map(t=>`<button type="button" onmousedown="event.preventDefault()" onclick="pickAddr('${fid}',this.textContent)">${esc(t)}</button>`).join('')+'<div class="addr-credit">Suggestions from OpenStreetMap</div>';list.classList.remove('hidden')}catch(e){hideAddr(fid)}}

function saveMarket(){let name=$('marketName').value.trim(),target=Number($('marketTarget').value),cost=Number($('marketCost').value);if(!name)return appAlert('Enter a market name.');if(!Number.isFinite(cost)||cost<0)return appAlert('Enter a valid market cost.');if(!Number.isFinite(target)||target<0)return appAlert('Enter a valid target amount.');let days=readMarketDays(),mid=id();data.markets.push({id:mid,name,location:$('marketLocation').value.trim(),cost,days,date:days[0]?.date||'',target,items:{}});save();openMarket(mid,true);toast('Market created.')}

function formatMarketDay(d){if(!d.date)return '';let date=new Date(d.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});const t=v=>v?new Date('2000-01-01T'+v).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'';return date+(d.start||d.end?' · '+(t(d.start)||'Time TBD')+' – '+(t(d.end)||'Time TBD'):' · Times not set')}
function marketDetail(){let m=data.markets.find(x=>x.id===marketSelected);if(!m)return '<p>Market not found.</p>';m.items||={};let allocated=Object.entries(m.items).reduce((a,[pid,q])=>a+num(q)*num(product(pid)?.price),0),allValue=data.products.reduce((a,p)=>a+num(p.stock)*num(p.price),0),sold=data.sales.filter(s=>s.marketId===m.id).reduce((a,s)=>a+s.qty*s.price,0);let days=m.days?.length?m.days:(m.date?[{date:m.date,start:'',end:''}]:[]);let draftCount=Object.values(marketSaleDraft).reduce((a,q)=>a+q,0),draftValue=Object.entries(marketSaleDraft).reduce((a,[pid,q])=>a+q*num(product(pid)?.price),0);return `${backBtn()}<div class="panel" style="margin-top:12px"><div class="row" style="align-items:flex-start"><h2>${esc(m.name)}</h2><button class="alt" onclick="go('marketInfo')">Details</button></div>${m.completed?'<span class="pill ok">Completed ✓</span>':''}<div class="muted" style="margin:8px 0">${days.length?days.map(d=>`<div style="margin:4px 0">📅 ${esc(formatMarketDay(d))}</div>`).join(''):'📅 Dates and times not set'}</div><div class="muted" style="margin:8px 0">Market cost: ${cash(m.cost||0)}</div>${todoLine(m)}<div class="row" style="align-items:center;justify-content:flex-start;gap:8px"><span>📍 ${esc(m.location||'Address not set')}</span>${m.location?`<button class="alt small" onclick="marketDirectionsSaved()">Directions ↗</button>`:''}</div>${m.completed?'':`<label>Inventory value target ($)</label><input id="targetEdit" type="number" min="0" step="1" value="${num(m.target)}" onchange="setMarketTarget(this.value)">${num(m.target)?`<div class="row" style="font-size:13px;font-weight:700;margin:12px 0 6px"><span>Packed ${cash(allocated)} of ${cash(m.target)}</span><span>${Math.min(100,Math.round(allocated/num(m.target)*100))}%</span></div><div class="bar"><div style="width:${Math.min(100,Math.round(allocated/num(m.target)*100))}%"></div></div>`:''}<div class="grid keep2" style="margin-top:12px"><div><div class="muted">Assigned to this market</div><div class="stat">${cash(allocated)}</div></div><div><div class="muted">Remaining to target</div><div class="stat">${cash(Math.max(0,num(m.target)-allocated))}</div></div><div><div class="muted">All finished stock value</div><div class="stat">${cash(allValue)}</div></div><div><div class="muted">Sales at this market</div><div class="stat">${cash(sold)}</div></div></div><p class="hint">Market inventory is reserved for planning. Sales reduce stock only after you tap Complete sale.</p>`}</div>${m.completed?completedPanel(m):`<div class="panel"><div class="actions" style="margin-top:0"><button onclick="showMarketAdd()">${marketAddOpen?'Close':'+ Add inventory'}</button><button class="alt" onclick="includeAllInventory()">Include all available</button></div><div id="marketAdd" class="${marketAddOpen?'':'hidden'}"><label>Find a product</label><input id="marketSearch" placeholder="Search products" value="${esc(marketAddSearch)}" oninput="marketAddSearch=this.value;$('pickList').innerHTML=marketPickRows()"><div class="picklist" id="pickList">${marketPickRows()}</div><label>Quantity</label><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="alt" onclick="stepMarketQty(-1)">−</button><input id="marketQty" type="number" min="1" step="1" value="1" style="width:90px;text-align:center"><button class="alt" onclick="stepMarketQty(1)">+</button><button class="alt small" onclick="setMarketQtyMax()">All available</button></div><div class="actions"><button onclick="addMarketItem()">Add to market</button></div></div></div>`}<div class="panel"><div class="row"><h3>Inventory to bring</h3>${m.completed?'':`<button class="${marketSaleMode?'danger':'aqua'} small" onclick="toggleMarketSale()">${marketSaleMode?'Cancel sale':'Start a sale'}</button>`}</div>${marketSaleMode?`<p class="hint">Tap + next to each product sold (− to undo). Nothing is deducted until you complete the sale.</p>`:''}${Object.entries(m.items).map(([pid,q])=>{let p=product(pid);if(!p)return '';let count=marketSaleDraft[pid]||0;return `<div class="entry row"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${cash(p.price)} × ${q} = ${cash(p.price*q)}</div>${marketSaleMode&&count?`<div class="muted">Selling ${count} · ${cash(count*p.price)}</div>`:''}</div>${marketSaleMode?`<button class="alt small" onclick="adjustMarketSale('${pid}',-1)">−</button><b>${count}</b><button class="alt small" onclick="adjustMarketSale('${pid}',1)">+</button>`:`<button class="alt small" onclick="changeMarketItem('${pid}',-1)">−</button><b>${q}</b><button class="alt small" onclick="changeMarketItem('${pid}',1)">+</button>`}</div>`}).join('')||(m.completed?'<p class="muted">Unsold items went back to your available stock.</p>':'<p class="muted">No products assigned yet.</p>')}${marketSaleMode?`<div style="margin-top:16px">${(()=>{let tx=Object.entries(marketSaleDraft).reduce((a,[pid,q])=>a+(productTaxed(product(pid))?q*num(product(pid)?.price)*taxRate()/100:0),0);return tx?`<div class="muted">${draftCount} item(s) · ${cash(draftValue)} + ${cash(tx)} tax</div><div class="stat" style="font-size:24px">Total ${cash(draftValue+tx)}</div>`:`<b>${draftCount} item(s) · ${cash(draftValue)} total</b>`})()}<div class="actions"><button ${draftCount?'':'disabled'} onclick="completeMarketSale()">Complete sale</button></div></div>`:''}</div>${m.completed?'':finishPanel(m)}`}
function marketDirectionsSaved(){let m=data.markets.find(x=>x.id===marketSelected);if(!m?.location)return;window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(m.location),'_blank','noopener')}
function toggleMarketSale(){marketSaleMode=!marketSaleMode;marketSaleDraft={};render()}
function adjustMarketSale(pid,delta){let m=data.markets.find(x=>x.id===marketSelected),limit=Math.min(num(m.items?.[pid]),num(product(pid)?.stock)),next=(marketSaleDraft[pid]||0)+delta;if(next<0||next>limit)return;if(next)marketSaleDraft[pid]=next;else delete marketSaleDraft[pid];render()}
function completeMarketSale(){let m=data.markets.find(x=>x.id===marketSelected),entries=Object.entries(marketSaleDraft).filter(([pid,q])=>q>0);if(!entries.length)return appAlert('Tap + on at least one item you sold.');for(let [pid,q] of entries){let p=product(pid);if(!p||q>num(m.items[pid])||q>num(p.stock))return appAlert('Stock has changed since this sale started. Please check the items and try again.')}for(let [pid,q] of entries){let p=product(pid);p.stock-=q;m.items[pid]-=q;if(!m.items[pid])delete m.items[pid];data.sales.push({id:id(),marketId:m.id,productId:pid,qty:q,price:num(p.price),tax:productTaxed(p)?round2(q*num(p.price)*taxRate()/100):0,taxRate:taxRate(),date:new Date().toISOString(),estimatedMaterialCost:recipeCost(p)})}marketSaleMode=false;marketSaleDraft={};save();render();toast('Sale completed and inventory updated.')}
function marketInfo(){let m=data.markets.find(x=>x.id===marketSelected);if(!m)return '<p>Market not found.</p>';let days=m.days?.length?m.days:[{date:m.date||'',start:'',end:''}];return `${backBtn()}<div class="panel"><h2>Market details</h2><label>Market name</label><input id="infoName" value="${esc(m.name)}">${addressField('infoLocation',m.location||'')}<div class="actions"><button class="alt small" onclick="marketDirections()">📍 Directions (choose maps app)</button></div><label>Market cost ($)</label><input id="infoCost" type="number" min="0" step="0.01" value="${num(m.cost)}"><h3 style="margin-top:20px">Market dates & times</h3><div id="marketDays">${days.map(d=>marketDayRow(d)).join('')}</div><button class="alt small" onclick="addMarketDay()">+ Add another day</button><div class="actions"><button onclick="saveMarketInfo()">Save details</button></div></div>`}

function marketPickRows(){let q=marketAddSearch.toLowerCase().trim(),list=data.products.filter(p=>!q||[p.name,p.variation].some(x=>String(x||'').toLowerCase().includes(q)));return list.map(p=>{let av=availableFor(p.id);return `<button type="button" class="pick ${marketAddPick===p.id?'on':''}" ${av?'':'disabled'} onclick="pickMarketProduct('${p.id}')"><span class="grow">${esc(p.name)}${p.variation?' — '+esc(p.variation):''}</span><span class="muted">${av} available</span></button>`}).join('')||'<p class="muted">No matching products.</p>'}

function stepMarketQty(d){let e=$('marketQty'),max=marketAddPick?Math.max(1,availableFor(marketAddPick)):Infinity;e.value=Math.min(max,Math.max(1,Math.floor(num(e.value)+d)))}

async function includeAllInventory(){let m=data.markets.find(x=>x.id===marketSelected);let adds=data.products.map(p=>[p,availableFor(p.id)]).filter(([p,a])=>a>0);if(!adds.length)return appAlert('All finished inventory is already assigned to markets.');let count=adds.reduce((a,[p,q])=>a+q,0),value=adds.reduce((a,[p,q])=>a+q*num(p.price),0);if(!await appConfirm(`Add all available inventory to this market?\n\n${count} item(s) across ${adds.length} product(s), worth ${cash(value)}.`))return;m.items||={};for(let [p,q] of adds)m.items[p.id]=num(m.items[p.id])+q;save();render();toast(`${count} item(s) added to ${m.name}.`)}
function addMarketItem(){let m=data.markets.find(x=>x.id===marketSelected),pid=marketAddPick,q=Number($('marketQty').value),p=product(pid);if(!p)return appAlert('Tap a product in the list first.');if(!Number.isInteger(q)||q<1)return appAlert('Enter a whole number of 1 or more.');let av=availableFor(pid);if(q>av)return appAlert(`Only ${av} unassigned ${p.name} available across markets.`);m.items||={};m.items[pid]=num(m.items[pid])+q;marketAddPick=null;marketAddSearch='';save();render();toast(`${q} ${p.name} added to ${m.name}.`)}

function marketTime(m){let d=m.days?.[0]?.date||m.date;if(d)return new Date(d+'T12:00:00').getTime();if(m.completedAt)return new Date(m.completedAt).getTime();let t=data.sales.filter(x=>x.marketId===m.id).map(x=>new Date(x.date).getTime());return t.length?Math.min(...t):null}

function reportRanges(){let y=new Date().getFullYear(),opts=[['all','All markets'],['3m','Last 3 months'],['6m','Last 6 months'],['12m','Last 12 months']];let yrs=data.markets.filter(m=>m.completed).map(marketTime).filter(t=>t!==null).map(t=>new Date(t).getFullYear());let first=yrs.length?Math.min(...yrs):y;for(let yr=y-1;yr>=first;yr--)opts.push(['y'+yr,String(yr)]);return opts}
function rangeBounds(r){if(r==='all')return [-Infinity,Infinity];if(r[0]==='y'){let yr=Number(r.slice(1));return [new Date(yr,0,1).getTime(),new Date(yr+1,0,1).getTime()]}let now=new Date(),months={'3m':3,'6m':6,'12m':12}[r]||0;return [new Date(now.getFullYear(),now.getMonth()-months,now.getDate()).getTime(),Infinity]}
function reports(){let opts=reportRanges();if(!opts.some(o=>o[0]===reportRange))reportRange='all';let [a,b]=rangeBounds(reportRange),inRange=completedBetween(a,b).sort((x,y)=>(marketTime(y)||0)-(marketTime(x)||0));if(reportMarket!=='all'&&!inRange.some(m=>m.id===reportMarket))reportMarket='all';let sel=reportMarket==='all'?inRange:inRange.filter(m=>m.id===reportMarket),f=marketFigures(sel),anyDone=data.markets.some(m=>m.completed),pending=data.markets.filter(m=>!m.completed&&data.sales.some(x=>x.marketId===m.id)).length;const mdate=m=>{let t=marketTime(m);return t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''};let best=Object.entries(f.sales.reduce((acc,x)=>{acc[x.productId]=(acc[x.productId]||0)+num(x.qty);return acc},{})).sort((x,y)=>y[1]-x[1]).slice(0,5);let breakdown=reportMarket==='all'&&sel.length?`<div class="panel"><h3>By market</h3>${sel.map(m=>{let r=marketFigures([m]);return `<button class="rowbtn" onclick="reportMarket='${m.id}';render()"><div class="row"><b>${esc(m.name)}</b><b class="${r.profit<0?'neg':'pos'}">${signedCash(r.profit)}</b></div><div class="muted">${mdate(m)} · Sales ${cash(r.revenue)} · Booth ${cash(r.booth)}</div></button>`}).join('')}</div>`:'';return `<h2>Reports</h2><div class="panel"><label for="repRange" style="margin-top:0">Time frame</label><select id="repRange" onchange="reportRange=this.value;reportMarket='all';render()">${opts.map(([v,l])=>`<option value="${v}" ${reportRange===v?'selected':''}>${l}</option>`).join('')}</select><label for="repMarket">Market</label><select id="repMarket" onchange="reportMarket=this.value;render()"><option value="all">All markets in this time frame (${inRange.length})</option>${inRange.map(m=>`<option value="${m.id}" ${reportMarket===m.id?'selected':''}>${esc(m.name)}${mdate(m)?' · '+mdate(m):''}</option>`).join('')}</select></div>${anyDone?'':`<div class="panel"><h3>No completed markets yet</h3><p class="muted">A market shows up here once you mark it a function saveSettings(){data.settings={...data.settings,hourly:num($('shourly').value),method:$('smethod').value,multiplier:num($('smultiplier').value),markup:num($('smarkup').value),rounding:$('srounding').value,autoDeduct:$('sdeduct').checked};save();goBack();toast('Pricing defaults saved.')}function blobToDataUrl(b){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function dataUrlToBlob(u){let [head,body]=String(u).split(',');let mime=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';let bin=atob(body||''),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}

async function exportData(share){try{let patterns=await pdfAll();let stamp=new Date();data.lastBackup=stamp.toISOString();let backup={app:'Crochet Studio',backupVersion:2,exported:stamp.toISOString(),data,patterns:await Promise.all(patterns.map(async p=>({id:p.id,name:p.name,date:p.date,mime:p.mime,thumb:p.thumb||'',thumbCustom:!!p.thumbCustom,dataUrl:await blobToDataUrl(p.blob)})))};let name='crochet-studio-backup-'+stamp.toISOString().slice(0,10)+'.json';let file=new File([JSON.stringify(backup)],name,{type:'application/json'});if(share&&canShareFiles()){try{await navigator.share({files:[file],title:'Crochet Studio backup'})}catch(e){if(e.name==='AbortError')return;throw e}}else{let a=document.createElement('a'),u=URL.createObjectURL(file);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}save();toast('Backup created.')}catch(e){console.error(e);appAlert('Could not create the backup. '+(e.message||''))}}
async function importData(e){let f=e.target.files?.[0];e.target.value='';if(!f)return;let parsed;try{parsed=JSON.parse(await f.text())}catch{return appAlert('That file is not a Crochet Studio backup.')}let d=parsed&&parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;if(!d||!(Array.isArray(d.products)||Array.isArray(d.materials)))return appAlert('That file is not a Crochet Studio backup.');let pats=Array.isArray(parsed.patterns)?parsed.patterns:[];let summary=`${(d.products||[]).length} products, ${(d.materials||[]).length} materials, ${(d.markets||[]).length} markets, ${(d.sales||[]).length} sales${parsed.patterns?`, ${pats.length} patterns`:''}`;if(!await appConfirm(`Restore this backup?\n\n${summary}\n\nThis replaces everything currently in the app.`))return;try{data=normalizeData(d);await (saveQueue=saveQueue.then(()=>idbSet('app','data',data)));if(parsed.patterns){for(let p of await pdfAll())await pdfDelete(p.id);for(let p of pats)if(p&&p.dataUrl)await pdfPut({id:p.id||id(),name:p.name||'Pattern',date:p.date||new Date().toISOString(),mime:p.mime||'application/pdf',thumb:p.thumb||'',thumbCustom:!!p.thumbCustom,thumbTried:!!p.thumb,blob:dataUrlToBlob(p.dataUrl)})}await refreshPdfs();view('home');toast('Backup restored.')}catch(err){console.error(err);appAlert('Could not restore the backup. Your phone may be low on storage.')}}
async function resetData(){clearTimeout(saveTimer);saveTimer=null;if(!await appConfirm('Delete all products, materials, sales, markets and patterns from this device? This cannot be undone.'))return;if(saveTimer)flushSave();await saveQueue;await idbDel('app','data');try{localStorage.removeItem(KEY)}catch{}for(let p of await pdfAll())await pdfDelete(p.id);location.reload()}

let installPromptEvent=null;const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

let dlgDone=null;
function appDialog({title='',message='',ok='OK',cancel=null,danger=false}){return new Promise(res=>{dlgDone?.(false);let o=document.createElement('div');o.id='appDialog';o.className='modal dialog';o.innerHTML=`<div class="panel modal-card dialog-card" role="${cancel?'alertdialog':'dialog'}" aria-modal="true" aria-describedby="dlgMsg">${title?`<h3>${esc(title)}</h3>`:''}<p id="dlgMsg" class="dlg-msg">${esc(message)}</p><div class="actions dlg-actions">${cancel?`<button class="alt" data-v="0">${esc(cancel)}</button>`:''}<button class="${danger?'dangerfill':''}" data-v="1">${esc(ok)}</button></div></div>`;const key=e=>{if(e.key==='Escape'){e.preventDefault();finish(false)}};const finish=v=>{if(dlgDone!==finish)return;dlgDone=null;document.removeEventListener('keydown',key,true);o.remove();res(v)};dlgDone=finish;o.addEventListener('click',e=>{let b=e.target.closest('button[data-v]');if(b)finish(b.dataset.v==='1');else if(e.target===o&&cancel)finish(false)});document.addEventListener('keydown',key,true);document.body.appendChild(o);setTimeout(()=>o.querySelector('button[data-v="1"]')?.focus(),30)})}

// ===== Tax =====
function taxRate(){return num(data.settings.taxRate)}
function round2(v){return Math.round(v*100)/100}
function settingsTax(){let s=data.settings;return `${backBtn()}<h2 style="margin-top:12px">Tax</h2><div class="panel"><label for="tRate" style="margin-top:0">Tax rate (%)</label><input id="tRate" type="number" min="0" max="100" step="0.01" inputmode="decimal" value="${num(s.taxRate)}"><div class="hint">Ontario HST is 13%. Change it for your province or country.</div><label class="check"><input type="checkbox" id="tPurch" ${s.taxOnPurchases?'checked':''}> Material prices I enter are before tax</label><div class="hint">Tax is added on top of what you enter when you buy materials, so the app can track the tax you paid. You can change this for each material.</div><label class="check"><input type="checkbox" id="tSales" ${s.taxOnSales?'checked':''}> Add tax to my selling prices</label><div class="hint">Tax is added at market checkout and tracked as tax collected. You can change this for each product.</div><div class="actions"><button onclick="saveTaxSettings()">Save</button></div></div><p class="hint" style="margin:0 6px">Tax totals are shown in Reports by calendar year. They're a guide only, not tax advice.</p>`}
function saveTaxSettings(){let v=$('tRate').value.trim(),r=Number(v);if(v===''||!(r>=0&&r<=100))return needField('tRate','Enter a tax rate between 0 and 100.');Object.assign(data.settings,{taxRate:r,taxOnPurchases:$('tPurch').checked,taxOnSales:$('tSales').checked});save();goBack();toast('Tax settings saved.')}
function logPurchase(m,packs,price){packs=Number(packs)||0;if(!m||packs<=0)return;let pr=num(price??m.price),taxed=m.taxed??data.settings.taxOnPurchases;data.purchases.push({id:id(),materialId:m.id,date:new Date().toISOString(),packs,price:pr,taxed:!!taxed,rate:taxRate(),tax:taxed?round2(packs*pr*taxRate()/100):0,store:m.store||''})}
function productTaxed(p){return p?.taxed??data.settings.taxOnSales}
let taxYear=new Date().getFullYear();
function taxYears(){let ys=new Set([new Date().getFullYear()]);for(let x of data.purchases)ys.add(new Date(x.date).getFullYear());for(let x of data.sales)if(num(x.tax))ys.add(new Date(x.date).getFullYear());return [...ys].sort((a,b)=>b-a)}
function taxPanel(){let ys=taxYears();if(!ys.includes(taxYear))taxYear=ys[0];const inY=d=>new Date(d).getFullYear()===taxYear;let spent=data.purchases.filter(x=>inY(x.date)).reduce((a,x)=>a+num(x.tax),0),coll=data.sales.filter(x=>inY(x.date)).reduce((a,x)=>a+num(x.tax),0),diff=coll-spent;return `<div class="panel"><div class="row"><h3 style="margin:0">Sales tax</h3><select id="taxYear" style="width:auto;min-width:110px" aria-label="Tax year" onchange="taxYear=Number(this.value);render()">${ys.map(y=>`<option value="${y}" ${y===taxYear?'selected':''}>${y}</option>`).join('')}</select></div><div class="grid keep2" style="margin-top:12px"><div><div class="muted">Tax collected</div><div class="stat">${cash(coll)}</div></div><div><div class="muted">Tax paid on materials</div><div class="stat">${cash(spent)}</div></div><div class="wide"><div class="muted">Difference (collected − paid)</div><div class="stat ${diff<0?'bad':''}">${signedCash(diff)}</div></div></div><p class="hint">Jan 1 – Dec 31, ${taxYear}. Counts every sale and material purchase dated in that year, whether or not the market is completed. If you're registered for HST, the difference is roughly what you'd remit. A guide only; check with an accountant or the CRA.</p></div>`}
function openAddToCategory(pid){let pr=product(pid);if(!pr)return;let cats=data.productCategories.slice().sort(byName);openModal(`<div class="row"><h2 style="margin:0">Add to category</h2>${closeX()}</div><p class="muted">${esc(pr.name)}</p>${cats.map(c=>`<button class="rowbtn" onclick="setProductCategory('${pid}','${c.id}')"><div class="row"><b>${ic('folder',16)} ${esc(c.name)}</b><span class="muted">${data.products.filter(x=>x.categoryId===c.id).length}</span></div></button>`).join('')||'<p class="muted">No categories yet.</p>'}<label for="ncName">${cats.length?'Or create a new category':'Create a category'}</label><div class="row"><input id="ncName" placeholder="e.g. Plushies, Wearables" autocapitalize="words" onkeydown="if(event.key==='Enter')createAndAssign('${pid}')"><button onclick="createAndAssign('${pid}')">Add</button></div>`)}

// ===== Navigation: back returns to wherever you came from =====

function unitName(u){return unitObj(u)?.name||u||''}
function recipeCost(p){return (p.materials||[]).reduce((a,x)=>{let m=material(x.materialId);return a+num(x.amount)*(num(m?.price)/Math.max(.001,num(m?.weight)))},0)}
function savedValues(cid,field){let map=new Map();for(let m of data.materials){if(m.categoryId!==cid)continue;let v=normName(m[field]);if(!v)continue;let k=v.toLowerCase();if(!map.has(k))map.set(k,{label:v,count:0});map.get(k).count++}return [...map.values()]}
function canonical(cid,field,v){v=normName(v);if(!v)return v;let hit=savedValues(cid,field).find(x=>x.label.toLowerCase()===v.toLowerCase());return hit?hit.label:v}
function findDuplicateMaterial(cid,name,colour,exceptId){return data.materials.find(m=>m.id!==exceptId&&m.categoryId===cid&&normName(m.name).toLowerCase()===name.toLowerCase()&&normName(m.colour).toLowerCase()===String(colour||'').toLowerCase())}
function unitSelect(sid,sel){return `<select id="${sid}" data-prev="${esc(sel)}" onchange="unitChanged('${sid}')">${data.units.map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(u.name)} (${esc(u.short)})</option>`).join('')}<option value="__new">+ Add a new unit…</option></select>`}
function unitNewBox(sid){return `<div id="${sid}New" class="newunit hidden"><div class="two"><div><label for="${sid}NewName">Unit name</label><input id="${sid}NewName" placeholder="e.g. yards"></div><div><label for="${sid}NewShort">Short form</label><input id="${sid}NewShort" placeholder="e.g. yd"></div></div><div class="actions"><button type="button" class="small" onclick="addUnitFrom('${sid}')">Add unit</button><button type="button" class="alt small" onclick="cancelNewUnit('${sid}')">Cancel</button></div></div>`}
function unitChanged(sid){let el=$(sid);if(el.value==='__new'){$(sid+'New')?.classList.remove('hidden');$(sid+'NewName')?.focus()}else{el.dataset.prev=el.value;$(sid+'New')?.classList.add('hidden');if(sid==='munit'){let d=$('mstockDisplay');if(d)d.textContent=num(material(editing)?.stock)+' '+unitShort(el.value)}}}
function cancelNewUnit(sid){let el=$(sid);el.value=el.dataset.prev||data.units[0].id;$(sid+'New')?.classList.add('hidden')}
function createUnit(name,short){name=normName(name);short=normName(short)||name;if(!name)return null;let ex=data.units.find(u=>u.name.toLowerCase()===name.toLowerCase()||u.short.toLowerCase()===short.toLowerCase());if(ex)return ex;let u={id:'u_'+id(),name,short};data.units.push(u);save();return u}
function addUnitFrom(sid){let u=createUnit($(sid+'NewName').value,$(sid+'NewShort').value);if(!u)return appAlert('Enter a unit name, e.g. yards.');$(sid).outerHTML=unitSelect(sid,u.id);$(sid+'New').classList.add('hidden');$(sid+'NewName').value='';$(sid+'NewShort').value='';flash(`Unit “${u.name}” ready to use.`)}
function unitInUse(u){return data.materials.some(m=>m.unit===u.id)||data.materialCategories.some(c=>c.unit===u.id)}
function openUnitsModal(){openModal(`<div class="row"><h2 style="margin:0">Units</h2>${closeX()}</div><p class="muted">Units are how materials are measured. Add your own for other crafts, like yards, metres or skeins.</p>${data.units.map(u=>`<div class="row entry" style="margin:6px 0"><span><b>${esc(u.name)}</b> <span class="muted">(${esc(u.short)})</span></span>${u.builtin?'<span class="chip">Built-in</span>':unitInUse(u)?'<span class="chip">In use</span>':`<button class="danger small" onclick="deleteUnit('${u.id}')">Delete</button>`}</div>`).join('')}<h3 style="margin-top:18px">Add a unit</h3><div class="two"><div><label for="nuName">Unit name</label><input id="nuName" placeholder="e.g. yards"></div><div><label for="nuShort">Short form</label><input id="nuShort" placeholder="e.g. yd"></div></div><div class="actions"><button onclick="addUnitModal()">Add unit</button></div>`)}
function addUnitModal(){let nm=$('nuName').value;if(!normName(nm))return appAlert('Enter a unit name, e.g. yards.');let before=data.units.length,u=createUnit(nm,$('nuShort').value);if(screen==='materials')render();openUnitsModal();flash(data.units.length>before?`Unit “${u.name}” added.`:`“${u.name}” already exists.`)}
async function deleteUnit(uid){let u=unitObj(uid);if(!u||u.builtin||unitInUse(u))return;if(!await appConfirm(`Delete the unit “${u.name}”?`))return;data.units=data.units.filter(x=>x.id!==uid);save();if(screen==='materials')render();openUnitsModal()}
let matCatFromForm=false;
function openMatCategoryModal(cid,fromForm){matCatFromForm=!!fromForm;let c=mcat(cid),count=c?data.materials.filter(m=>m.categoryId===c.id).length:0;openModal(`<div class="row"><h2 style="margin:0">${c?'Edit':'New'} material category</h2>${closeX()}</div><label for="mcName">Category name</label><input id="mcName" value="${esc(c?.name||'')}" placeholder="e.g. Beads, Fabric, Buttons"><label for="mcUnit">Usually measured in</label>${unitSelect('mcUnit',c?.unit||'g')}${unitNewBox('mcUnit')}<label class="check"><input type="checkbox" id="mcOn" ${!c||c.onProducts?'checked':''}> Show on every new product</label><p class="hint">Turn this off for things you only use sometimes. You can still add it to any product with the buttons under “Need something else?”.</p><div class="actions"><button onclick="saveMatCategory('${c?.id||''}')">Save</button>${c?`<button class="danger" onclick="deleteMatCategory('${c.id}')">Delete</button>`:''}</div>${c&&count?`<p class="hint">${count} material${count>1?'s':''} in this category. Renaming keeps them all.</p>`:''}`);setTimeout(()=>{if(!c)$('mcName')?.focus()},60)}
function saveMatCategory(cid){let name=normName($('mcName').value),unit=$('mcUnit').value;if(!name)return appAlert('Enter a category name.');if(unit==='__new')return appAlert('Finish adding the new unit first (tap Add unit).');let dup=data.materialCategories.find(c=>c.id!==cid&&c.name.toLowerCase()===name.toLowerCase());if(dup)return appAlert(`You already have a “${dup.name}” category.`);let c=mcat(cid);if(c)Object.assign(c,{name,unit,onProducts:$('mcOn').checked});else{c={id:'mc_'+id(),name,unit,onProducts:$('mcOn').checked};data.materialCategories.push(c)}save();closeModal();if(matCatFromForm&&screen==='productForm'){if(!productSecs.includes(c.id))productSecs.push(c.id);if(!productLines.some(l=>l.catId===c.id))productLines.push({key:id(),catId:c.id,materialId:'',amount:''});redrawSupplies();flash(`“${name}” added to this product.`)}else{materialCatId=c.id;render();flash(`Category “${name}” saved.`)}}
async function deleteMatCategory(cid){let c=mcat(cid),n=data.materials.filter(m=>m.categoryId===cid).length;if(n)return appAlert(`“${c.name}” still has ${n} material${n>1?'s':''}. Move them to another category (open each one → Category) or delete them first.`);if(data.materialCategories.length<2)return appAlert('You need at least one material category.');if(!await appConfirm(`Delete the “${c.name}” category?`))return;data.materialCategories=data.materialCategories.filter(x=>x.id!==cid);save();closeModal();render();flash('Category deleted.')}


function savedStores(){let map=new Map();for(let x of [...data.materials,...data.purchases]){let v=normName(x.store);if(v&&!map.has(v.toLowerCase()))map.set(v.toLowerCase(),v)}return [...map.values()].sort((a,b)=>a.localeCompare(b))}
function canonStore(v){v=normName(v);if(!v)return '';return savedStores().find(x=>x.toLowerCase()===v.toLowerCase())||v}
function storeField(fid,val){return comboField({id:fid,value:val,placeholder:'e.g. Michaels, Walmart, Amazon',autocap:true,source:()=>savedStores().map(x=>({label:x,sub:`${data.materials.filter(m=>normName(m.store).toLowerCase()===x.toLowerCase()).length} material(s)`}))})}
let materialSort='type';const MAT_SORTS=[['type','Sort: Type (A–Z)'],['variation','Sort: Variation (A–Z)'],['priceLow','Sort: Price, low to high'],['priceHigh','Sort: Price, high to low'],['store','Sort: Where purchased']];
function sortMaterials(list){let L=list.slice(),lab=m=>materialLabel(m).toLowerCase();if(materialSort==='variation')L.sort((a,b)=>String(a.colour||'~').localeCompare(String(b.colour||'~'))||lab(a).localeCompare(lab(b)));else if(materialSort==='priceLow')L.sort((a,b)=>num(a.price)-num(b.price)||lab(a).localeCompare(lab(b)));else if(materialSort==='priceHigh')L.sort((a,b)=>num(b.price)-num(a.price)||lab(a).localeCompare(lab(b)));else if(materialSort==='store')L.sort((a,b)=>(normName(a.store)||'~').localeCompare(normName(b.store)||'~')||lab(a).localeCompare(lab(b)));else L.sort((a,b)=>lab(a).localeCompare(lab(b)));return L}
function flatMaterialList(list,showCat){let L=sortMaterials(list);if(materialSort!=='store')return L.map(m=>materialCard(m,showCat?'full':'label')).join('');let out='',last=null;for(let m of L){let st=normName(m.store)||'No store set';if(st!==last){out+=`<div class="section-label">${esc(st)}</div>`;last=st}out+=materialCard(m,showCat?'full':'label')}return out}

let materialCatId=null,matGroupOpen=new Set(),matGroupInfo=[];
function gkey(cid,name){return cid+'|'+normName(name).toLowerCase()}
function materials(){let cats=data.materialCategories;if(!cats.some(c=>c.id===materialCatId))materialCatId=cats[0]?.id;return `<div class="row"><h2>Materials</h2></div><div class="actions toprow" style="margin:-6px 0 12px"><button onclick="newMaterial('${materialCatId||''}')">+ Material</button><button class="alt" onclick="openMatCategoryModal()">+ Category</button><button class="alt" onclick="openUnitsModal()">Units</button></div><input id="materialSearch" placeholder="Search materials (type, variation, store)" value="${esc(materialSearch)}" oninput="materialSearch=this.value;drawMaterialRows()"><label for="matSort" class="sr">Sort materials</label><select id="matSort" style="margin-top:10px" onchange="materialSort=this.value;drawMaterialRows()">${MAT_SORTS.map(([v,l])=>`<option value="${v}" ${materialSort===v?'selected':''}>${l}</option>`).join('')}</select><div class="tabs" style="margin-top:12px">${cats.map(x=>`<button class="${x.id===materialCatId?'':'alt'} small" onclick="materialCatId='${x.id}';render()">${esc(x.name)}</button>`).join('')}</div><div id="materialRows">${materialRows()}</div>`}
function materialCard(m,mode){let c=mcat(m.categoryId),isDef=c?.defaultMaterialId===m.id,full=mode===true||mode==='full';return `<div class="panel row matcard">${thumb(m.photo||m.photos?.[0]||'',"width:52px;height:52px")}<div class="grow"><b>${esc(mode&&mode!=='group'?materialLabel(m):(m.colour||'No variation set'))}</b>${isDef?' <span class="chip">Default</span>':''}<div class="muted">${full?esc(c?.name||'')+' · ':''}${m.store&&materialSort!=='store'?esc(m.store)+' · ':''}${cash(m.price)} / ${num(m.weight)} ${esc(unitShort(m.unit))}${m.trackStock?` · ${num(m.stock)} ${esc(unitShort(m.unit))} left`:''}</div></div><button class="alt small" onclick="editMaterial('${m.id}')">Edit</button></div>`}
function materialRows(){let q=materialSearch.toLowerCase().trim();if(q){let hits=data.materials.filter(m=>[m.name,m.colour,m.store,mcat(m.categoryId)?.name].some(x=>String(x||'').toLowerCase().includes(q))).sort((a,b)=>materialLabel(a).localeCompare(materialLabel(b)));return flatMaterialList(hits,true)||'<div class="panel muted">No materials match your search.</div>'}let c=mcat(materialCatId);if(!c)return '';let groups=new Map();for(let m of data.materials.filter(m=>m.categoryId===c.id)){let k=gkey(c.id,m.name);if(!groups.has(k))groups.set(k,{key:k,catId:c.id,name:normName(m.name),items:[]});groups.get(k).items.push(m)}matGroupInfo=[...groups.values()].sort(byName);let dm=material(c.defaultMaterialId),inCat=data.materials.filter(m=>m.categoryId===c.id),head=`<div class="cat-head"><div class="muted">Measured in ${esc(unitName(c.unit))} · ${c.onProducts?'on every new product':'added to products when needed'}${dm?`<br>Default: <b>${esc(materialLabel(dm))}</b>`:''}</div><button class="alt small" onclick="openMatCategoryModal('${c.id}')">Edit category</button></div>`;if(materialSort!=='type')return head+(flatMaterialList(inCat,false)||`<div class="panel muted">No ${esc(c.name.toLowerCase())} saved yet. Tap + Material to add one.</div>`);return head+(matGroupInfo.map((g,i)=>{let open=matGroupOpen.has(g.key),n=g.items.length,photo=g.items.map(m=>m.photo||m.photos?.[0]).find(Boolean)||'';g.items.sort((a,b)=>String(a.colour||'').localeCompare(String(b.colour||'')));return `<div class="folder ${open?'open':''}"><button class="folder-head" onclick="toggleMatGroup(${i})" aria-expanded="${open}">${thumb(photo,'width:46px;height:46px')}<span class="grow"><b>${esc(g.name)}</b><span class="muted">${n} variation${n>1?'s':''}${g.items.some(m=>c.defaultMaterialId===m.id)?' · default inside':''}</span></span><span class="chev" aria-hidden="true">›</span></button>${open?`<div class="folder-body">${g.items.map(m=>materialCard(m,'group')).join('')}<div class="actions" style="margin:6px 0 2px"><button class="alt small" onclick="addToMatGroup(${i})">+ Add variation</button><button class="alt small" onclick="renameMatGroup(${i})">Rename</button></div></div>`:''}</div>`}).join('')||`<div class="panel muted">No ${esc(c.name.toLowerCase())} saved yet. Tap + Material to add one.</div>`)}
function toggleMatGroup(i){let k=matGroupInfo[i]?.key;if(!k)return;matGroupOpen.has(k)?matGroupOpen.delete(k):matGroupOpen.add(k);drawMaterialRows()}
function addToMatGroup(i){let g=matGroupInfo[i];if(g)newMaterial(g.catId,g.name)}
function renameMatGroup(i){let g=matGroupInfo[i];if(!g)return;openModal(`<div class="row"><h2 style="margin:0">Rename type</h2>${closeX()}</div><p class="muted">This renames all ${g.items.length} variation${g.items.length>1?'s':''} of ${esc(g.name)}.</p><label for="rgName">Type / brand name</label><input id="rgName" value="${esc(g.name)}"><div class="actions"><button onclick="saveMatGroupName(${i})">Save</button></div>`)}
function saveMatGroupName(i){let g=matGroupInfo[i],nm=normName($('rgName').value);if(!g||!nm)return appAlert('Enter a name.');let canon=data.materials.find(m=>m.categoryId===g.catId&&gkey(g.catId,m.name)!==g.key&&normName(m.name).toLowerCase()===nm.toLowerCase());nm=canon?normName(canon.name):nm;for(let m of data.materials)if(m.categoryId===g.catId&&gkey(g.catId,m.name)===g.key)m.name=nm;matGroupOpen.delete(g.key);matGroupOpen.add(gkey(g.catId,nm));save();closeModal();drawMaterialRows();flash(canon?`Merged into ${nm}.`:`Renamed to ${nm}.`)}

let materialPreset=null,quickTarget=null,quickCatId=null;
function suggestionInputs(prefix,name='',colour=''){const cid=()=>prefix==='m'?$('mcat')?.value:quickCatId;const nameNow=()=>normName($(prefix+'name')?.value).toLowerCase();return `<label for="${prefix}name">Type / brand</label>${comboField({id:prefix+'name',value:name,placeholder:'Start typing, e.g. Bernat Blanket',autocap:true,source:()=>savedValues(cid(),'name').map(x=>({label:x.label,sub:`${x.count} variation${x.count>1?'s':''} saved`})),onPick:()=>fillFromSibling(prefix)})}<div class="hint" style="margin-top:5px">All variations of the same type are grouped together on the Materials page.</div><label for="${prefix}colour">Variation (optional)</label>${comboField({id:prefix+'colour',value:colour,placeholder:'e.g. Lilac, 12 mm, Large',autocap:true,source:()=>savedValues(cid(),'colour').map(x=>({label:x.label,sub:data.materials.some(m=>m.categoryId===cid()&&normName(m.name).toLowerCase()===nameNow()&&normName(m.colour).toLowerCase()===x.label.toLowerCase())?'Already saved with this type':''}))})}`}
function fillFromSibling(prefix){if(prefix==='m'&&editing)return;let cid=prefix==='m'?$('mcat')?.value:quickCatId,nm=normName($(prefix+'name')?.value).toLowerCase(),sib=data.materials.find(m=>m.categoryId===cid&&normName(m.name).toLowerCase()===nm);if(!sib)return;let pr=$(prefix+'price');if(pr&&pr.value===''){pr.value=sib.price;let w=$(prefix+'weight');if(w)w.value=sib.weight;let u=$(prefix+'unit');if(u&&unitObj(sib.unit)){u.value=sib.unit;u.dataset.prev=sib.unit}let st=$(prefix+'store');if(st&&!st.value&&sib.store)st.value=sib.store}}
function refreshMaterialSuggestions(){comboClose('mname');comboClose('mcolour')}
function setMaterialFormDefaults(){}
function newMaterial(catId,name){go('materialForm',()=>{editing=null;materialPhotos=[];materialPreset={catId:catId||materialCatId||data.materialCategories[0]?.id,name:name||''}})}
function editMaterial(mid){go('materialForm',()=>{editing=mid;let m=material(mid);materialPhotos=[...(m?.photos||(m?.photo?[m.photo]:[]))];materialPreset=null})}
function materialForm(){let m=material(editing)||{},catId=m.categoryId||materialPreset?.catId||data.materialCategories[0]?.id,c=mcat(catId),presetName=m.name||materialPreset?.name||'',sib=!editing&&presetName?data.materials.find(x=>x.categoryId===catId&&normName(x.name).toLowerCase()===presetName.toLowerCase()):null,unit=m.unit||sib?.unit||c?.unit||'g';return `${backBtn()}<div class="panel" style="margin-top:12px"><h2>${editing?'Edit':'Add'} material</h2><form novalidate onsubmit="saveMaterial(event)"><label for="mcat">Category</label><select id="mcat" onchange="materialCatChanged()">${data.materialCategories.map(x=>`<option value="${x.id}" ${x.id===catId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${suggestionInputs('m',presetName,m.colour||'')}<div class="two"><div><label for="mweight">Package size</label><input id="mweight" type="number" min="0.001" step="any" required value="${m.weight??sib?.weight??(unit==='g'?100:1)}"></div><div><label for="munit">Unit</label>${unitSelect('munit',unit)}</div></div>${unitNewBox('munit')}<label for="mprice">Price paid per package ($)</label><input id="mprice" type="number" min="0" step="0.01" inputmode="decimal" required value="${m.price??sib?.price??''}"><label class="check"><input id="mtaxed" type="checkbox" ${(m.taxed??sib?.taxed??data.settings.taxOnPurchases)?'checked':''}> This price is before tax (adds ${num(data.settings.taxRate)}%)</label><label for="mstore">Where purchased (optional)</label>${storeField('mstore',m.store??sib?.store??'')}<label class="check"><input id="mtrack" type="checkbox" ${(m.trackStock??sib?.trackStock)?'checked':''}> Track remaining stock ${stockHelpButton()}</label><div class="hint">Optional: when on, the app tracks how much of this material is left. Making finished products only deducts it if automatic deductions are on in Settings.</div><div class="panel" style="background:var(--card2);margin-top:12px;box-shadow:none"><div class="muted">Current remaining stock</div><div class="big" id="mstockDisplay">${num(m.stock)} ${esc(unitShort(unit))}</div><div class="hint">Changes when you add packages below or when tracked materials are used.</div></div><label for="mpackages">Packages purchased / add to stock</label><div class="row" style="justify-content:flex-start"><button type="button" class="alt" onclick="stepNumber('mpackages',-1)" aria-label="One fewer">−</button><input id="mpackages" type="number" min="0" step="1" value="${editing?0:1}" style="width:90px;text-align:center"><button type="button" class="alt" onclick="stepNumber('mpackages',1)" aria-label="One more">+</button></div><div class="hint">One package holds the package size above. For an existing material, enter how many new packages to add.</div><label>Material photo (optional)</label><div class="actions"><button type="button" class="alt small" onclick="$('mphotoCamera').click()">📷 Camera</button><button type="button" class="alt small" onclick="$('mphotoGallery').click()">▧ Gallery</button></div><input id="mphotoCamera" class="hidden" type="file" accept="image/*" capture="environment" multiple onchange="loadMaterialPhoto(event,false)"><input id="mphotoGallery" class="hidden" type="file" accept="image/*" multiple onchange="loadMaterialPhoto(event,false)"><div id="materialPhotoPreview">${photoGallery("material")}</div><label class="check"><input type="checkbox" id="mdefault" ${editing&&c?.defaultMaterialId===m.id?'checked':''}> <span>Make this the default <span id="mdefaultCat">${esc((c?.name||'material').toLowerCase())}</span></span></label><div class="hint">The default is filled in for you whenever you create a new product.</div><div class="actions"><button type="submit">Save material</button>${editing?`<button type="button" class="danger" onclick="deleteMaterial('${editing}')">Delete</button>`:''}</div></form></div>`}
function materialCatChanged(){comboClose('mname');comboClose('mcolour');let dc=$('mdefaultCat');if(dc)dc.textContent=(mcat($('mcat').value)?.name||'material').toLowerCase();if(editing)return;let c=mcat($('mcat').value),u=$('munit');if(c&&u&&unitObj(c.unit)){u.value=c.unit;u.dataset.prev=c.unit}}
async function saveMaterial(e){e.preventDefault();let catId=$('mcat').value,c=mcat(catId),unit=$('munit').value,packs=Number($('mpackages').value),weight=num($('mweight').value),name=canonical(catId,'name',$('mname').value),colour=canonical(catId,'colour',$('mcolour').value);if(unit==='__new')return needField('munitNewName','Finish adding the new unit first (tap Add unit).');if(!name)return needField('mname','Enter a type or brand name, e.g. Polyfill.');if(!(weight>0))return needField('mweight','Enter the package size (more than 0).');if($('mprice').value.trim()===''||!(Number($('mprice').value)>=0))return needField('mprice','Enter the price you paid per package. Use 0 if it was free.');if(!Number.isInteger(packs)||packs<0)return needField('mpackages','Enter a whole number of packages (0 or more).');let dup=findDuplicateMaterial(catId,name,colour,editing),label=name+(colour?' — '+colour:'');if(dup){if(editing||packs<1)return appAlert(`You already have ${label} saved. Change the type or variation, or edit the saved one instead.`);if(!await appConfirm(`You already have ${label} saved.\n\nAdd ${packs} package${packs>1?'s':''} to its stock instead of saving it twice?`))return;dup.stock=num(dup.stock)+packs*num(dup.weight);logPurchase(dup,packs,num($('mprice').value));matGroupOpen.add(gkey(catId,name));save();goBack();return toast(`Added to ${label}.`)}let m={id:editing||id(),categoryId:catId,name,colour,weight,unit,price:num($('mprice').value),store:canonStore($('mstore').value),taxed:$('mtaxed').checked,trackStock:$('mtrack').checked,photo:materialPhotos[0]||'',photos:[...materialPhotos],stock:(editing?num(material(editing)?.stock):0)+packs*weight};if(editing)Object.assign(material(editing),m);else data.materials.push(m);logPurchase(material(m.id),packs);for(let x of data.materialCategories)if(x.defaultMaterialId===m.id&&(x.id!==catId||!$('mdefault').checked))x.defaultMaterialId='';if($('mdefault').checked)c.defaultMaterialId=m.id;matGroupOpen.add(gkey(catId,name));materialCatId=catId;save();goBack();toast('Material saved.')}
async function deleteMaterial(mid){if(data.products.some(p=>(p.materials||[]).some(x=>x.materialId===mid)))return appAlert('This material is used by a product. Remove it from that product first.');if(!await appConfirm('Delete this material?'))return;data.materials=data.materials.filter(m=>m.id!==mid);for(let c of data.materialCategories)if(c.defaultMaterialId===mid)c.defaultMaterialId='';save();goBack()}
function openQuickMaterial(catId,prefill='',target=null){closeQuickMaterial();quickCatId=catId;quickTarget=target;quickPhotos=[];let c=mcat(catId),unit=c?.unit||'g',o=document.createElement('div');o.id='quickOverlay';o.className='modal';o.innerHTML=`<div class="panel modal-card" role="dialog" aria-modal="true"><div class="row"><h2 style="margin:0">New ${esc((c?.name||'material').toLowerCase())}</h2><button class="iconbtn" aria-label="Close" onclick="closeQuickMaterial()">${ic('x',18)}</button></div>${suggestionInputs('q',prefill)}<div class="two"><div><label for="qweight">Package size</label><input id="qweight" type="number" min="0.001" step="any" value="${unit==='g'?100:1}"></div><div><label for="qunit">Unit</label>${unitSelect('qunit',unit)}</div></div>${unitNewBox('qunit')}<label for="qprice">Package price ($)</label><input id="qprice" type="number" min="0" step="0.01" inputmode="decimal"><label class="check"><input id="qtaxed" type="checkbox" ${data.settings.taxOnPurchases?'checked':''}> This price is before tax (adds ${num(data.settings.taxRate)}%)</label><label for="qstore">Where purchased (optional)</label>${storeField('qstore','')}<label for="qpackages">Packages purchased</label><div class="row" style="justify-content:flex-start"><button class="alt" onclick="stepNumber('qpackages',-1)" aria-label="One fewer">−</button><input id="qpackages" type="number" min="0" step="1" value="1" style="width:90px;text-align:center"><button class="alt" onclick="stepNumber('qpackages',1)" aria-label="One more">+</button></div><label class="check"><input id="qtrack" type="checkbox"> Track remaining stock ${stockHelpButton()}</label><label class="check"><input id="qdefault" type="checkbox" ${c&&!material(c.defaultMaterialId)?'':''}> Make this the default ${esc((c?.name||'material').toLowerCase())}</label><label>Photo (optional)</label><div class="actions"><button class="alt small" onclick="$('qcamera').click()">📷 Camera</button><button class="alt small" onclick="$('qgallery').click()">▧ Gallery</button></div><input class="hidden" id="qcamera" type="file" accept="image/*" capture="environment" multiple onchange="loadMaterialPhoto(event,true)"><input class="hidden" id="qgallery" type="file" accept="image/*" multiple onchange="loadMaterialPhoto(event,true)"><div id="quickPhotoPreview"></div><div class="actions"><button onclick="saveQuickMaterial()">Save and select</button><button class="alt" onclick="closeQuickMaterial()">Cancel</button></div></div>`;document.body.appendChild(o);if(prefill)setTimeout(()=>fillFromSibling('q'),0)}
async function saveQuickMaterial(){let cid=quickCatId,name=canonical(cid,'name',$('qname').value),colour=canonical(cid,'colour',$('qcolour').value),unit=$('qunit').value,weight=Number($('qweight').value),price=Number($('qprice').value),packs=Number($('qpackages').value);if(unit==='__new')return needField('qunitNewName','Finish adding the new unit first (tap Add unit).');if(!name)return needField('qname','Enter a type or brand name, e.g. Polyfill.');if(!(weight>0))return needField('qweight','Enter the package size (more than 0).');if($('qprice').value.trim()===''||!(price>=0))return needField('qprice','Enter the price you paid per package. Use 0 if it was free.');if(!Number.isInteger(packs)||packs<0)return needField('qpackages','Enter a whole number of packages (0 or more).');let dup=findDuplicateMaterial(cid,name,colour,null),label=name+(colour?' — '+colour:''),m;if(dup){if(!await appConfirm(`You already have ${label} saved.\n\nUse that one${packs?` and add ${packs} package${packs>1?'s':''} to its stock`:''}?`))return;dup.stock=num(dup.stock)+packs*num(dup.weight);logPurchase(dup,packs,price);m=dup}else{m={id:id(),categoryId:cid,name,colour,weight,unit,price,store:canonStore($('qstore').value),taxed:$('qtaxed').checked,trackStock:$('qtrack').checked,stock:packs*weight,photo:quickPhotos[0]||'',photos:[...quickPhotos]};data.materials.push(m);logPurchase(m,packs)}if($('qdefault')?.checked){let c=mcat(cid);if(c)c.defaultMaterialId=m.id}save();closeQuickMaterial();placeMaterialInForm(m)}
function placeMaterialInForm(m){if(screen!=='productForm'||!$('supplies'))return flash(`${materialLabel(m)} saved.`);let cid=m.categoryId,l=quickTarget?lineByFid(quickTarget):null;if(!l)l=productLines.find(x=>x.catId===cid&&!x.materialId);if(!l){l={key:id(),catId:cid,materialId:'',amount:''};productLines.push(l)}if(!productSecs.includes(cid))productSecs.push(cid);l.materialId=m.id;redrawSupplies();updatePrice();setTimeout(()=>$('amt_'+l.key)?.focus(),60);flash(`${materialLabel(m)} added. Now enter the amount used.`)}

// ===== Product form: material sections =====
let productLines=[],productSecs=[],productCatPreset='';
function lineByFid(fid){return productLines.find(l=>'ln_'+l.key===fid)}
function initLines(p){productLines=(p?.materials||[]).filter(x=>material(x.materialId)).map(x=>({key:id(),catId:material(x.materialId).categoryId,materialId:x.materialId,amount:x.amount}));let used=new Set(productLines.map(l=>l.catId));productSecs=data.materialCategories.filter(c=>c.onProducts||used.has(c.id)).map(c=>c.id);for(let cid of productSecs)if(!productLines.some(l=>l.catId===cid)){let def=!p&&material(mcat(cid)?.defaultMaterialId)?mcat(cid).defaultMaterialId:'';productLines.push({key:id(),catId:cid,materialId:def,amount:''})}}
function newProduct(catId){go('productForm',()=>{editing=null;photo='';productPhotos=[];productCatPreset=catId||'';initLines(null)})}
function editProduct(pid){go('productForm',()=>{editing=pid;let p=product(pid);photo=p.photo||'';productPhotos=[...(p.photos||(photo?[photo]:[]))];productCatPreset='';initLines(p)})}
function supplyPicker(fid,cid,selectedId){let c=mcat(cid),m=material(selectedId),noun=(c?.name||'material').toLowerCase();return `<input type="hidden" id="${fid}" value="${m?m.id:''}">${comboField({id:fid+'Q',value:materialLabel(m),placeholder:`Start typing to find ${noun}`,currentLabel:()=>materialLabel(material($(fid)?.value)),source:()=>data.materials.filter(x=>x.categoryId===cid).map(x=>({label:materialLabel(x),id:x.id,photo:x.photo||x.photos?.[0]||'',sub:`${cash(x.price)} / ${num(x.weight)} ${unitShort(x.unit)}${x.trackStock?` · ${num(x.stock)} ${unitShort(x.unit)} left`:''}`})),emptyText:`No ${noun} saved yet. Type a name to add one.`,onPick:it=>setPicker(fid,it.id),onCommit:txt=>{let cur=material($(fid)?.value);if(!txt){if(cur)setPicker(fid,'');return}if(cur&&txt===materialLabel(cur))return;let hit=data.materials.find(x=>x.categoryId===cid&&materialLabel(x).toLowerCase()===txt.toLowerCase());if(hit)setPicker(fid,hit.id);else{let q=$(fid+'Q');if(q)q.value=materialLabel(cur)}},onNew:q=>openQuickMaterial(cid,q,fid)})}`}
function setPicker(fid,mid){let h=$(fid);if(h)h.value=mid||'';let q=$(fid+'Q');if(q)q.value=materialLabel(material(mid));let l=lineByFid(fid);if(l){l.materialId=mid||'';let u=$('unit_'+l.key);if(u)u.textContent=unitShort(material(mid)?.unit||mcat(l.catId)?.unit)}updatePrice()}
function lineHtml(l,c){return `<div class="entry line">${supplyPicker('ln_'+l.key,c.id,l.materialId)}<div class="row" style="margin-top:8px;gap:8px;justify-content:flex-start"><label for="amt_${l.key}" style="margin:0;white-space:nowrap">Amount used</label><input id="amt_${l.key}" type="number" min="0" step="any" inputmode="decimal" value="${esc(l.amount??'')}" oninput="setLineAmount('${l.key}',this.value)" style="flex:1;min-width:0"><span class="unit" id="unit_${l.key}">${esc(unitShort(material(l.materialId)?.unit||c.unit))}</span><button class="iconbtn sm" aria-label="Remove this ${esc(c.name.toLowerCase())}" onclick="removeLine('${l.key}')">${ic('x',16)}</button></div></div>`}
function suppliesHtml(){let secs=data.materialCategories.filter(c=>productSecs.includes(c.id)),others=data.materialCategories.filter(c=>!productSecs.includes(c.id));return secs.map(c=>{let lines=productLines.filter(l=>l.catId===c.id),noun=esc(c.name.toLowerCase());return `<div class="supsec"><div class="sechead"><h3>${esc(c.name)}</h3><button class="alt small" onclick="openQuickMaterial('${c.id}')">+ New ${noun}</button></div>${lines.map(l=>lineHtml(l,c)).join('')}<div class="actions" style="margin-top:8px"><button class="alt small" onclick="addLine('${c.id}')">+ Add ${lines.length?'another ':''}${noun}</button><button class="alt small" onclick="removeSec('${c.id}')">Not needed</button></div></div>`}).join('<div class="divider"></div>')+`<div class="divider"></div><div class="hint" style="font-weight:800">Need something else?</div><div class="actions" style="margin-top:6px">${others.map(c=>`<button class="alt small" onclick="addSec('${c.id}')">+ ${esc(c.name)}</button>`).join('')}<button class="alt small" onclick="openMatCategoryModal(null,true)">+ New material category</button></div>`}
function redrawSupplies(){let e=$('supplies');if(e)e.innerHTML=suppliesHtml()}
function setLineAmount(key,v){let l=productLines.find(x=>x.key===key);if(l)l.amount=v;updatePrice()}
function addLine(cid){productLines.push({key:id(),catId:cid,materialId:'',amount:''});redrawSupplies()}
function removeLine(key){productLines=productLines.filter(l=>l.key!==key);redrawSupplies();updatePrice()}
function addSec(cid){if(!productSecs.includes(cid))productSecs.push(cid);if(!productLines.some(l=>l.catId===cid))productLines.push({key:id(),catId:cid,materialId:'',amount:''});redrawSupplies()}
async function removeSec(cid){let n=productLines.filter(l=>l.catId===cid&&l.materialId).length;if(n&&!await appConfirm(`Remove ${mcat(cid)?.name} from this product?`))return;productSecs=productSecs.filter(x=>x!==cid);productLines=productLines.filter(l=>l.catId!==cid);redrawSupplies();updatePrice()}

function getDraft(){return {name:$('pname').value.trim(),variation:$('pvariation').value.trim(),photo:productPhotos[0]||"",photos:[...productPhotos],hook:$('phook').value,hours:num($('phours').value),materials:productLines.filter(l=>l.materialId&&num(l.amount)>0).map(l=>({materialId:l.materialId,amount:num(l.amount)})),categoryId:$('pcat')?.value||'',taxed:$('ptaxed')?$('ptaxed').checked:undefined,method:$('pmethod').value,multiplier:num($('pmultiplier').value),markup:num($('pmarkup').value),patternId:$('ppattern').value}}
function categoryPicker(selId){let c=pcat(selId);return `<input type="hidden" id="pcat" value="${c?c.id:''}">${comboField({id:'pcatQ',value:c?.name||'',placeholder:'None — type to pick or create one',currentLabel:()=>pcat($('pcat')?.value)?.name||'',source:()=>data.productCategories.slice().sort(byName).map(x=>({label:x.name,id:x.id,sub:`${data.products.filter(p=>p.categoryId===x.id).length} product(s)`})),emptyText:'No categories yet. Type a name to create one.',onPick:it=>{$('pcat').value=it.id},onCommit:txt=>{let cur=pcat($('pcat').value);if(!txt){$('pcat').value='';return}if(cur&&txt===cur.name)return;let hit=data.productCategories.find(x=>x.name.toLowerCase()===txt.toLowerCase());if(hit){$('pcat').value=hit.id;$('pcatQ').value=hit.name}else $('pcatQ').value=cur?.name||''},onNew:q=>{let nm=normName(q),c2=data.productCategories.find(x=>x.name.toLowerCase()===nm.toLowerCase())||(()=>{let n={id:id(),name:nm};data.productCategories.push(n);save();return n})();$('pcat').value=c2.id;$('pcatQ').value=c2.name;flash(`Category “${c2.name}” ready.`)}})}`}

// ===== Products page with folders =====
let productFolderOpen=new Set();
function productCard(p){return `<div class="panel item">${thumb(p.photo||'',"")}<div class="grow"><div class="row titlerow"><div class="item-title">${esc(p.name)}</div>${pcat(p.categoryId)?'':`<button class="alt small addcat" onclick="openAddToCategory('${p.id}')">${ic('folder',14)} Add to category</button>`}</div><div class="muted">${cash(p.price)} · ${num(p.stock)} in stock</div><div class="actions"><button class="alt small" onclick="quickRemove('${p.id}')" aria-label="Remove one ${esc(p.name)} from stock">−1</button><button class="small" onclick="quickAdd('${p.id}')" aria-label="Add one ${esc(p.name)} to stock">+1</button><button class="alt small" onclick="detail('${p.id}')">Open / adjust</button></div></div></div>`}
function products(){return `<div class="row"><h2>Products</h2></div><div class="actions toprow" style="margin:-6px 0 12px"><button onclick="newProduct()">+ Product</button><button class="alt" onclick="openCategoryModal()">+ Category</button></div><input placeholder="Search products" value="${esc(productFilter)}" oninput="productFilter=this.value;document.getElementById('productList').innerHTML=productRows()"><div id="productList" style="margin-top:12px">${productRows()}</div>`}
function productRows(){let q=productFilter.toLowerCase().trim(),match=p=>!q||[p.name,p.variation,pcat(p.categoryId)?.name].some(x=>String(x||'').toLowerCase().includes(q)),loose=data.products.filter(p=>!pcat(p.categoryId)&&match(p)),cats=data.productCategories.slice().sort(byName),folders='';for(let c of cats){let items=data.products.filter(p=>p.categoryId===c.id&&match(p));if(q&&!items.length&&!c.name.toLowerCase().includes(q))continue;let open=(q&&items.length)||productFolderOpen.has(c.id);folders+=`<div class="folder ${open?'open':''}"><button class="folder-head" onclick="toggleFolder('${c.id}')" aria-expanded="${!!open}">${ic('folder',24)}<span class="grow"><b>${esc(c.name)}</b><span class="muted">${items.length} product${items.length===1?'':'s'}</span></span><span class="chev" aria-hidden="true">›</span></button>${open?`<div class="folder-body">${items.length?`<div class="cardgrid">${items.map(productCard).join('')}</div>`:''}${items.length?'':'<p class="muted" style="margin:4px 4px 10px">No products in this category yet.</p>'}<div class="actions" style="margin:4px 0 2px"><button class="alt small" onclick="newProduct('${c.id}')">+ Product here</button><button class="alt small" onclick="openCategoryModal('${c.id}')">Rename / delete</button></div></div>`:''}</div>`}if(!loose.length&&!folders)return '<div class="panel muted">'+(q?'No products match your search.':'No products yet. Tap + Product to add your first one.')+'</div>';return (loose.length?`<div class="cardgrid">${loose.map(productCard).join('')}</div>`:'')+(folders?(loose.length?'<div class="section-label">Categories</div>':'')+folders:'')}
function toggleFolder(cid){productFolderOpen.has(cid)?productFolderOpen.delete(cid):productFolderOpen.add(cid);let e=$('productList');if(e)e.innerHTML=productRows()}
function openCategoryModal(cid){let c=pcat(cid);openModal(`<div class="row"><h2 style="margin:0">${c?'Edit':'New'} product category</h2>${closeX()}</div><label for="pcName">Category name</label><input id="pcName" value="${esc(c?.name||'')}" placeholder="e.g. Plushies, Wearables, Blankets" onkeydown="if(event.key==='Enter')savePCategory('${c?.id||''}')"><div class="actions"><button onclick="savePCategory('${c?.id||''}')">Save</button>${c?`<button class="danger" onclick="deletePCategory('${c.id}')">Delete category</button>`:''}</div>${c?'<p class="hint">Deleting a category keeps its products. They move to the top of the list.</p>':''}`);setTimeout(()=>{if(!c)$('pcName')?.focus()},60)}
function savePCategory(cid){let nm=normName($('pcName').value);if(!nm)return appAlert('Enter a category name.');let dup=data.productCategories.find(c=>c.id!==cid&&c.name.toLowerCase()===nm.toLowerCase());if(dup)return appAlert(`You already have a “${dup.name}” category.`);let c=pcat(cid);if(c)c.name=nm;else{c={id:id(),name:nm};data.productCategories.push(c);productFolderOpen.add(c.id)}save();closeModal();render();flash(`Category “${nm}” saved.`)}
async function deletePCategory(cid){let c=pcat(cid);if(!c)return;let n=data.products.filter(p=>p.categoryId===cid).length;if(!await appConfirm(`Delete the “${c.name}” category?${n?`\n\nIts ${n} product${n>1?'s':''} will stay, just without a category.`:''}`))return;for(let p of data.products)if(p.categoryId===cid)p.categoryId='';data.productCategories=data.productCategories.filter(x=>x.id!==cid);save();closeModal();render();flash('Category deleted.')}
addEventListener('popstate',()=>{if(skipPop){skipPop=false;return}let st=navStack.pop();if(st)restoreNav(st)});

document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;let t=e.target;if(!t||t.tagName!=='INPUT'||['checkbox','radio','button','submit','file','range'].includes(t.type))return;setTimeout(()=>{if(document.activeElement===t)t.blur()},0)});
new MutationObserver(()=>{for(let i of document.querySelectorAll('input:not([enterkeyhint])'))i.setAttribute('enterkeyhint','done')}).observe(document.body,{childList:true,subtree:true});

function linkLabels(root){for(let l of (root||document).querySelectorAll('label:not([for])')){if(l.querySelector('input,select,textarea'))continue;let n=l.nextElementSibling;if(n&&!/^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName))n=n.querySelector?.('input:not([type=hidden]),select,textarea');if(n&&n.id)l.htmlFor=n.id}}
new MutationObserver(()=>linkLabels()).observe(document.body,{childList:true,subtree:true});
const originalRender=render;render=function(){document.body.dataset.screen=screen;originalRender();if(screen==='materialForm')setMaterialFormDefaults();if(screen==='productForm'){let p=product(editing);$('pmethod').value=p?.method||data.settings.method;fillPatternOptions();updatePrice()}if(screen==='settingsPricing'){$('smethod').value=data.settings.method;$('srounding').value=data.settings.rounding}if(screen==='home'&&$('patternCount'))$('patternCount').textContent=pdfCache.length};(async()=>{$('app').innerHTML='<p class="muted">Loading…</p>';try{await loadData()}catch(e){console.error(e);appAlert('Could not open saved data on this device. Try closing and reopening the app.')}dataLoaded=true;delete data.settings.theme;render();refreshPdfs();requestPersistentStorage().then(()=>{if(screen==='settingsBackup')render()})})();if('serviceWorker' in navigator&&location.protocol.startsWith('http')){const hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||$('updateBar'))return;document.body.insertAdjacentHTML('beforeend','<div id="updateBar">New version ready<button onclick="location.reload()">Refresh</button></div>')});addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker not registered',e)))}
