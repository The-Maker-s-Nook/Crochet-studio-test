/* ===== Crochet Studio theme: lavender, aqua & pink (light + dark) ===== */
:root{color-scheme:only light;--ground:#F3EEFF;--card:#FFFFFF;--card2:#FCFAFF;--lav:#C9B5EE;--lav-soft:#EDE6FA;--lav-line:#D9CDEF;--lav-deep:#8D6CCB;--ink:#2E1F47;--ink2:#5B4782;--ink3:#6B5A8A;--hero-ink:#4A3570;--eyebrow:#6B5596;--aqua:#9FD6E0;--aqua-ring:#2F7F8C;--aqua-ink:#123F46;--alt-bg:#DDF2F5;--alt-ink:#123F46;--alt-ring:#9FD6E0;--pink:#B23A62;--pink-ink:#8E2A4C;--pink-soft:#FCE3EA;--pink-soft-ink:#9A2040;--gold-soft:#FFF6E5;--gold-ink:#6B4A10;--good:#1F7A3D;--bad:#B42828;--ok-bg:#E3F5EC;--ok-ink:#1E5B3A;--badge:#FFFFFF;--glass:rgba(255,255,255,.65);--shadow:rgba(74,53,112,.08);--shadow2:rgba(74,53,112,.18);--toast-bg:#2E1F47;--toast-ink:#FFFFFF;--tp-bg:#FCE3EA;--tp:#9C2F52;--ta-bg:#DDF2F5;--ta:#1F6A76;--tl-bg:#E9E0FB;--tl:#5B3F8C;--tg-bg:#FFF0D6;--tg:#8A5A12;--thumb-ico:#A893CF;--display:'Calistoga',Georgia,serif;font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--ground)}

html,body{overflow-x:clip;color-scheme:only light;background:var(--ground);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;border-radius:999px;padding:12px 18px;background:var(--pink);color:#fff;min-height:44px;transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}button:hover{filter:brightness(1.05)}button:disabled{opacity:.45}
button.alt{background:var(--alt-bg);color:var(--alt-ink);box-shadow:inset 0 0 0 1.5px var(--alt-ring)}
button.danger{background:var(--pink-soft);color:var(--pink-soft-ink);box-shadow:none}
button.small{padding:7px 13px;font-size:13px;min-height:34px}
button.outline{background:var(--card);color:var(--pink-ink);box-shadow:inset 0 0 0 2px var(--pink)}
button.aqua{background:var(--aqua);color:var(--aqua-ink);box-shadow:inset 0 0 0 2px var(--aqua-ring)}
header{background:var(--lav);border:0;border-radius:0 0 26px 26px;padding:max(14px,env(safe-area-inset-top)) 16px 14px;gap:10px}
header .brand{display:flex;align-items:center;gap:10px;font-family:'Dancing Script',var(--display);font-size:30px;font-weight:700;line-height:1;color:var(--ink)}
.badge{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn{width:44px;height:44px;padding:0;border-radius:50%;background:var(--glass);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:none;flex-shrink:0}
.iconbtn.sm{width:38px;height:38px;min-height:0;background:transparent;color:var(--ink3)}
main{padding:18px 16px 130px}
h2{font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);margin:4px 0 14px}
h3{font-family:var(--display);font-weight:400;font-size:19px;color:var(--ink);margin:2px 0 12px}
.panel{background:var(--card);color:var(--ink);border:0;border-radius:22px;padding:16px;box-shadow:0 4px 14px var(--shadow)}
.muted{color:var(--ink2)}.hint{color:var(--ink3)}
.stat{font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink)}
.big{font-family:var(--display);font-weight:400;font-size:32px}
label{font-weight:800;color:var(--ink2)}
input,select,textarea{border:1.5px solid var(--lav-line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);font-family:inherit;font-size:16px}
textarea{width:100%;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--ink3);opacity:.85}
input:focus,select:focus,textarea:focus{outline:3px solid var(--lav-soft);border-color:var(--lav-deep)}
select option{background:var(--card);color:var(--ink)}
input[type=checkbox]{accent-color:var(--pink);width:18px;height:18px;vertical-align:-3px}
input[type=range]{accent-color:var(--pink);border:0;padding:0;background:transparent}
.entry{border:1.5px solid var(--lav-soft);background:var(--card2);border-radius:16px;padding:12px}
.chip{background:var(--lav-soft);color:var(--ink);font-weight:800}
.notice{background:var(--ok-bg);color:var(--ok-ink);border-radius:16px;font-weight:700}
.divider{background:var(--lav-soft)}
.thumb{border-radius:16px;background:var(--lav-soft)}.thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--thumb-ico)}
.thumbbtn{padding:0;background:none;box-shadow:none;min-height:0;border-radius:16px;flex-shrink:0}
.item-title{font-family:var(--display);font-weight:400;font-size:18px}
.tabs{gap:8px}
a{color:var(--pink-ink)}
nav{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:560px;bottom:max(12px,env(safe-area-inset-bottom));border:0;border-radius:26px;background:var(--card);box-shadow:0 6px 20px var(--shadow2);padding:7px;justify-content:space-between;gap:2px}
nav button{flex:1;min-width:0;background:transparent;color:var(--ink2);font-size:11px;font-weight:700;padding:7px 2px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0;box-shadow:none}
nav button.active{background:var(--lav);color:var(--ink);font-weight:800}
nav button svg{display:block}
#updateBar{background:var(--toast-bg);color:var(--toast-ink);bottom:calc(92px + env(safe-area-inset-bottom))}#updateBar button{background:var(--card);color:var(--ink);min-height:0}
.photo-card{border:1.5px solid var(--lav-soft);border-radius:16px;background:var(--card)}.photo-card img{border-radius:12px}.photo-card button{min-height:0}
.pick{border:1.5px solid var(--lav-soft);border-radius:16px;background:var(--card);color:var(--ink);min-height:0;box-shadow:none;font-weight:700;justify-content:flex-start}.pick.on{border-color:var(--lav-deep);background:var(--lav-soft);box-shadow:inset 0 0 0 1px var(--lav-deep)}
.combo{position:relative}
.addr-list,.combo-list{position:absolute;left:0;right:0;top:100%;z-index:40;background:var(--card);border:1.5px solid var(--lav-line);border-radius:14px;margin-top:4px;box-shadow:0 8px 22px var(--shadow2);overflow:auto;max-height:290px}
.addr-list button,.combo-list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;justify-content:flex-start;background:var(--card);color:var(--ink);border-radius:0;border-bottom:1px solid var(--lav-soft);padding:11px 12px;font-size:15px;font-weight:600;min-height:46px;box-shadow:none}
.addr-list button:active,.combo-list button:active{background:var(--lav-soft);transform:none}
.combo-list img{width:34px;height:34px;border-radius:9px;object-fit:cover;flex-shrink:0}.combo-main{display:block}.combo-sub{display:block;font-size:12px;color:var(--ink3);font-weight:600}.combo-list .combo-new{color:var(--pink-ink);font-weight:800}.combo-empty{padding:12px 14px;font-size:14px;color:var(--ink3)}
.addr-credit{color:var(--ink3)}
.vbar{background:var(--lav);border:0;color:var(--ink)}.vbar span{color:var(--ink2)}#viewer{background:#221C2E}.vmsg{background:var(--card);color:var(--ink)}
.stat.good{color:var(--good)}.stat.bad{color:var(--bad)}.neg{color:var(--bad)}.pos{color:var(--good)}.wide{grid-column:1/-1}
.bar{height:12px;background:var(--lav-soft);border-radius:10px;overflow:hidden}.bar>div{height:100%;background:var(--aqua);border-radius:10px}
.hero{margin:-18px calc(50% - 50vw) 0;padding:2px calc(50vw - 50% + 4px) 48px;background:var(--lav);border-radius:0 0 32px 32px}body[data-screen=home] header{border-radius:0}
.hero .greet{font-family:var(--display);font-size:23px;line-height:1.2;color:var(--ink)}.hero .date{font-weight:800;color:var(--hero-ink);font-size:14px;margin-bottom:4px}
.nextcard{margin-top:-32px;position:relative}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--eyebrow)}
.pill{font-size:12px;font-weight:800;background:var(--pink-soft);color:var(--pink-soft-ink);padding:4px 10px;border-radius:20px;white-space:nowrap}.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pillcol{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.tile{display:flex;flex-direction:column;gap:4px;margin:0}.tile .muted{font-weight:700;font-size:13px}
.tic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.tic.pink{background:var(--tp-bg);color:var(--tp)}.tic.aqua{background:var(--ta-bg);color:var(--ta)}.tic.lav{background:var(--tl-bg);color:var(--tl)}.tic.gold{background:var(--tg-bg);color:var(--tg)}
.strip{background:var(--gold-soft);color:var(--gold-ink);border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;margin:0 0 14px}
.strip button{background:transparent;color:var(--gold-ink);text-decoration:underline;min-height:36px;padding:6px 8px;box-shadow:none}
.quick{display:flex;gap:10px;margin:0 0 14px}.quick button{flex:1}
.seg{display:flex;gap:4px;background:var(--lav-soft);padding:5px;border-radius:999px}.seg button{flex:1;background:transparent;color:var(--ink2);box-shadow:none;min-height:40px;padding:8px 6px;font-size:14px}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px var(--shadow2)}
.todo-line{width:100%;justify-content:space-between;background:var(--pink-soft);color:var(--pink-soft-ink);box-shadow:none;margin:4px 0 10px;font-size:14px;padding:10px 14px;border-radius:14px;min-height:44px}.todo-line.ok{background:var(--ok-bg);color:var(--ok-ink)}.todo-line.none{background:var(--alt-bg);color:var(--alt-ink)}
.todo-list{margin-top:10px}.todo{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--lav-soft)}.todo label{flex:1;display:flex;align-items:center;gap:12px;margin:0;font-size:16px;font-weight:600;color:var(--ink);min-height:48px;cursor:pointer}.todo input{width:22px;height:22px;flex-shrink:0}.todo.done span{text-decoration:line-through;color:var(--ink3)}
.rowbtn{display:block;width:100%;text-align:left;color:var(--ink);font-weight:inherit;min-height:0;box-shadow:none;border-radius:16px;background:var(--card2);border:1.5px solid var(--lav-soft);padding:12px;margin:8px 0}.rowbtn .row{gap:10px}
.notice{position:fixed;top:auto;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:60;width:calc(100% - 32px);max-width:520px;margin:0;box-shadow:0 6px 18px var(--shadow2)}.done-panel{box-shadow:inset 0 0 0 2px var(--ok-bg),0 4px 14px var(--shadow)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.folder{background:var(--card);border-radius:22px;box-shadow:0 4px 14px var(--shadow);margin:0 0 14px;overflow:hidden}
.folder-head{width:100%;justify-content:flex-start;background:transparent;color:var(--ink);box-shadow:none;border-radius:0;padding:14px 16px;gap:12px;text-align:left;font-weight:400;min-height:64px}
.folder-head b{display:block;font-family:var(--display);font-weight:400;font-size:18px}.folder-head .muted{display:block;font-size:13px;font-weight:600}
.folder-head>svg{color:var(--tl);background:var(--tl-bg);border-radius:12px;padding:8px;width:40px;height:40px;flex-shrink:0}
.chev{font-size:24px;color:var(--ink3);transition:transform .2s;line-height:1}.folder.open .chev{transform:rotate(90deg)}
.folder-body{padding:0 12px 12px}.folder-body .panel{box-shadow:none;background:var(--card2);border:1.5px solid var(--lav-soft);margin-bottom:10px}
.section-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--eyebrow);margin:18px 4px 10px}
.modal{position:fixed;inset:0;background:rgba(30,18,50,.55);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.modal-card{width:100%;max-width:470px;margin:6vh auto 24px}
label.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin:16px 0 4px}
.cat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 12px}.cat-head .muted{font-size:13px;font-weight:600}
.supsec{padding:4px 0}.supsec .sechead{margin:6px 0 10px}.supsec .sechead h3{font-size:19px}
.line{padding:10px}.line .unit{font-weight:800;color:var(--ink2);min-width:34px}
.newunit{background:var(--card2);border:1.5px dashed var(--lav-line);border-radius:16px;padding:4px 12px 12px;margin-top:10px}
.matcard{gap:12px}
.invalid{border-color:#B42828!important;outline:3px solid #F6C9C9!important}.titlerow{flex-wrap:wrap;align-items:flex-start;gap:6px 8px}.titlerow .item-title{flex:1 1 130px;min-width:0;overflow-wrap:break-word}.addcat{flex:none;padding:6px 10px;font-size:12px;min-height:32px;margin-left:auto}.toprow{gap:8px;flex-wrap:nowrap}.toprow button{padding:11px 14px;white-space:nowrap}@media(max-width:380px){.toprow button{padding:10px 11px;font-size:14px}}.dialog{z-index:1100;align-items:center}.dialog-card{max-width:400px;margin:auto;padding:20px}.dlg-msg{white-space:pre-line;color:var(--ink);font-size:16px;line-height:1.5;margin:2px 0 4px;font-weight:600}.dlg-actions{justify-content:flex-end}.dlg-actions button{min-width:96px}button.dangerfill{background:#B42828;color:#fff}
.menu{padding:6px}.menu-row{display:flex;width:100%;justify-content:flex-start;gap:12px;text-align:left;background:transparent;color:var(--ink);box-shadow:none;border-radius:16px;padding:12px 10px;min-height:60px;font-weight:400}.menu-row+.menu-row{border-top:1px solid var(--lav-soft);border-radius:0}.menu-row b{display:block;font-weight:800;font-size:16px}.menu-row .muted{display:block;font-size:13px;font-weight:600}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--lav);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;border:3px dotted var(--aqua);flex-shrink:0}
@media(min-width:700px){.grid.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.cardgrid>.panel{margin-bottom:14px}.quick{max-width:560px}}
@media(max-width:390px){.grid.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}nav button{font-size:10px}}
/* ===== Account screens ===== */
body[data-screen^=auth] header,body[data-screen^=auth] nav,body[data-screen^=auth] #updateBar{display:none}
body[data-screen^=auth] main{padding:0}

let reportRange='all',reportMarket='all';
function marketTime(m){let d=m.days?.[0]?.date||m.date;if(d)return new Date(d+'T12:00:00').getTime();if(m.completedAt)return new Date(m.completedAt).getTime();let t=data.sales.filter(x=>x.marketId===m.id).map(x=>new Date(x.date).getTime());return t.length?Math.min(...t):null}
function completedBetween(start,end){return data.markets.filter(m=>{if(!m.completed)return false;let t=marketTime(m);return t!==null&&t>=start&&t<end})}
const signedCash=v=>(v<0?'−':'')+cash(Math.abs(v));
function reportRanges(){let y=new Date().getFullYear(),opts=[['all','All markets'],['3m','Last 3 months'],['6m','Last 6 months'],['12m','Last 12 months']];let yrs=data.markets.filter(m=>m.completed).map(marketTime).filter(t=>t!==null).map(t=>new Date(t).getFullYear());let first=yrs.length?Math.min(...yrs):y;for(let yr=y-1;yr>=first;yr--)opts.push(['y'+yr,String(yr)]);return opts}

function reports(){let opts=reportRanges();if(!opts.some(o=>o[0]===reportRange))reportRange='all';let [a,b]=rangeBounds(reportRange),inRange=completedBetween(a,b).sort((x,y)=>(marketTime(y)||0)-(marketTime(x)||0));let qs=quickBetween(a,b);if(reportMarket!=='all'&&!(reportMarket==='quick'&&qs.length)&&!inRange.some(m=>m.id===reportMarket))reportMarket='all';let sel=reportMarket==='all'?inRange:inRange.filter(m=>m.id===reportMarket),f=marketFigures(sel,reportMarket==='all'||reportMarket==='quick'?qs:[]),anyDone=data.markets.some(m=>m.completed),pending=data.markets.filter(m=>!m.completed&&data.sales.some(x=>x.marketId===m.id)).length;const mdate=m=>{let t=marketTime(m);return t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''};let best=Object.entries(f.sales.reduce((acc,x)=>{acc[x.productId]=(acc[x.productId]||0)+num(x.qty);return acc},{})).sort((x,y)=>y[1]-x[1]).slice(0,5);let breakdown=reportMarket==='all'&&sel.length?`<div class="panel"><h3>By market</h3>${sel.map(m=>{let r=marketFigures([m]);return `<button class="rowbtn" onclick="reportMarket='${m.id}';render()"><div class="row"><b>${esc(m.name)}</b><b class="${r.profit<0?'neg':'pos'}">${signedCash(r.profit)}</b></div><div class="muted">${mdate(m)} · Sales ${cash(r.revenue)} · Booth ${cash(r.booth)}</div></button>`}).join('')}</div>`:'';return `<div class="row"><h2>Reports</h2><button class="small" onclick="go('reportDownload')">${ic('download',16)} Download</button></div><div class="panel"><label for="repRange" style="margin-top:0">Time frame</label><select id="repRange" onchange="reportRange=this.value;reportMarket='all';render()">${opts.map(([v,l])=>`<option value="${v}" ${reportRange===v?'selected':''}>${l}</option>`).join('')}</select><label for="repMarket">Market</label><select id="repMarket" onchange="reportMarket=this.value;render()"><option value="all">All markets in this time frame (${inRange.length})</option>${inRange.map(m=>`<option value="${m.id}" ${reportMarket===m.id?'selected':''}>${esc(m.name)}${mdate(m)?' · '+mdate(m):''}</option>`).join('')}${qs.length?`<option value="quick" ${reportMarket==='quick'?'selected':''}>Quick sales, no market (${new Set(qs.map(x=>x.orderId||x.id)).size})</option>`:''}</select></div>${anyDone||qs.length?'':`<div class="panel"><h3>No completed markets yet</h3><p class="muted">A market shows up here once you mark it as completed. Open a market and tap <b>Mark market as completed</b> when it’s over.</p></div>`}<div class="grid keep2"><div class="panel"><div class="muted">Sales revenue</div><div class="stat">${cash(f.revenue)}</div></div><div class="panel"><div class="muted">Items sold</div><div class="stat">${f.qty}</div></div><div class="panel"><div class="muted">Material costs</div><div class="stat">${cash(f.materials)}</div></div><div class="panel"><div class="muted">Booth costs</div><div class="stat">${cash(f.booth)}</div></div><div class="panel wide"><div class="muted">Profit${sel.length?` · ${sel.length} market${sel.length>1?'s':''}`:''}</div><div class="stat ${f.profit<0?'bad':'good'}">${signedCash(f.profit)}</div></div></div>${discountReport(f)}${best.length?`<div class="panel"><h3>Best sellers</h3>${best.map(([pid,q])=>`<div class="row entry" style="margin:6px 0"><span>${esc(product(pid)?.name||'Deleted product')}</span><b>${q} sold</b></div>`).join('')}</div>`:''}${breakdown}${pending?`<div class="panel muted">${pending} market${pending>1?'s have sales but aren’t':' has sales but isn’t'} marked completed yet, so ${pending>1?'they’re':'it’s'} not included here.</div>`:''}${materialValuePanel()}${taxPanel()}<div class="panel muted">Profit = sales after discounts − material costs − booth costs, before tax. Your time and payment fees are not included.</div>`}

function dataUrlToBlob(u){let [head,body]=String(u).split(',');let mime=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';let bin=atob(body||''),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}

async function exportData(share){try{let patterns=await pdfAll();let stamp=new Date();data.lastBackup=stamp.toISOString();let backup={app:'Crochet Studio',backupVersion:2,exported:stamp.toISOString(),data,patterns:await Promise.all(patterns.map(async p=>({id:p.id,name:p.name,date:p.date,mime:p.mime,thumb:p.thumb||'',thumbCustom:!!p.thumbCustom,dataUrl:await blobToDataUrl(p.blob)})))};let name='crochet-studio-backup-'+stamp.toISOString().slice(0,10)+'.json';let file=new File([JSON.stringify(backup)],name,{type:'application/json'});if(share&&canShareFiles()){try{await navigator.share({files:[file],title:'Crochet Studio backup'})}catch(e){if(e.name==='AbortError')return;throw e}}else{let a=document.createElement('a'),u=URL.createObjectURL(file);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}save();toast('Backup created.')}catch(e){console.error(e);appAlert('Could not create the backup. '+(e.message||''))}}
async function importData(e){let f=e.target.files?.[0];e.target.value='';if(!f)return;let parsed;try{parsed=JSON.parse(await f.text())}catch{return appAlert('That file is not a Crochet Studio backup.')}let d=parsed&&parsed.data&&typeof parsed.data==='object'?parsed.data:parsed;if(!d||!(Array.isArray(d.products)||Array.isArray(d.materials)))return appAlert('That file is not a Crochet Studio backup.');let pats=Array.isArray(parsed.patterns)?parsed.patterns:[];let summary=`${(d.products||[]).length} products, ${(d.materials||[]).length} materials, ${(d.markets||[]).length} markets, ${(d.sales||[]).length} sales${parsed.patterns?`, ${pats.length} patterns`:''}`;if(!await appConfirm(`Restore this backup?\n\n${summary}\n\n${signedIn()?'This replaces everything in the app and in your account, on all your devices.':'This replaces everything currently in the app.'}`))return;try{data=normalizeData(d);await (saveQueue=saveQueue.then(()=>idbSet('app','data',data)));if(parsed.patterns){for(let p of await pdfAll())await pdfDelete(p.id);for(let p of pats)if(p&&p.dataUrl)await pdfPut({id:p.id||id(),name:p.name||'Pattern',date:p.date||new Date().toISOString(),mime:p.mime||'application/pdf',thumb:p.thumb||'',thumbCustom:!!p.thumbCustom,thumbTried:!!p.thumb,blob:dataUrlToBlob(p.dataUrl)})}await refreshPdfs();markDirty();view('home');toast('Backup restored.')}catch(err){console.error(err);appAlert('Could not restore the backup. Your phone may be low on storage.')}}
async function resetData(){clearTimeout(saveTimer);saveTimer=null;let cloud=signedIn()&&syncMeta.userId===session.user.id;if(!await appConfirm(cloud?'Delete all products, materials, sales, markets and patterns from this device AND from your account? They will be removed on all your devices. This cannot be undone.':'Delete all products, materials, sales, markets and patterns from this device? This cannot be undone.'))return;if(cloud){if(!navigator.onLine)return appAlert('Connect to the internet first, so your account is cleared too.');let st=data.settings;for(let p of await pdfAll())await pdfDelete(p.id);data=normalizeData({settings:st});flushSave();await saveQueue;await syncNow();location.reload();return}await saveQueue;await idbDel('app','data');try{localStorage.removeItem(KEY)}catch{}for(let p of await pdfAll())await pdfDelete(p.id);location.reload()}
function backupReminder(){if(signedIn())return '';let hasData=data.products.length||data.materials.length;if(!hasData)return '';let last=data.lastBackup?new Date(data.lastBackup):null,days=last?(Date.now()-last)/864e5:Infinity;if(days<14)return '';return `<div class="strip">${ic('clock',18)}<span class="grow">${last?`Last backup ${Math.floor(days)} days ago`:'No backup yet'}</span><button onclick="go('settingsBackup')">Back up</button></div>`}

let dlgDone=null;
function appDialog({title='',message='',ok='OK',cancel=null,danger=false}){return new Promise(res=>{dlgDone?.(false);let o=document.createElement('div');o.id='appDialog';o.className='modal dialog';o.innerHTML=`<div class="panel modal-card dialog-card" role="${cancel?'alertdialog':'dialog'}" aria-modal="true" aria-describedby="dlgMsg">${title?`<h3>${esc(title)}</h3>`:''}<p id="dlgMsg" class="dlg-msg">${esc(message)}</p><div class="actions dlg-actions">${cancel?`<button class="alt" data-v="0">${esc(cancel)}</button>`:''}<button class="${danger?'dangerfill':''}" data-v="1">${esc(ok)}</button></div></div>`;const key=e=>{if(e.key==='Escape'){e.preventDefault();finish(false)}};const finish=v=>{if(dlgDone!==finish)return;dlgDone=null;document.removeEventListener('keydown',key,true);o.remove();res(v)};dlgDone=finish;o.addEventListener('click',e=>{let b=e.target.closest('button[data-v]');if(b)finish(b.dataset.v==='1');else if(e.target===o&&cancel)finish(false)});document.addEventListener('keydown',key,true);document.body.appendChild(o);setTimeout(()=>o.querySelector('button[data-v="1"]')?.focus(),30)})}
function needField(fid,msg){let e=$(fid);if(e){e.classList.add('invalid');e.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>e.classList.remove('invalid'),5000)}return appAlert(msg).then(()=>e?.focus())}

function appConfirm(message,opts={}){let m=String(message??''),first=m.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,''),ok=opts.ok||({delete:'Delete',remove:'Remove',reopen:'Reopen',restore:'Restore',mark:'Mark completed'}[first])||'Yes',danger=opts.danger??['delete','remove'].includes(first);return appDialog({message:m,ok,cancel:opts.cancel||'Cancel',danger})}

// ===== Tax =====
function taxRate(){return num(data.settings.taxRate)}
function round2(v){return Math.round(v*100)/100}
function settingsTax(){let s=data.settings;return `${backBtn()}<h2 style="margin-top:12px">Tax</h2><div class="panel"><label for="tRate" style="margin-top:0">Tax rate (%)</label><input id="tRate" type="number" min="0" max="100" step="0.01" inputmode="decimal" value="${num(s.taxRate)}"><div class="hint">Ontario HST is 13%. Change it for your province or country.</div><label class="check"><input type="checkbox" id="tPurch" ${s.taxOnPurchases?'checked':''}> Material prices I enter are before tax</label><div class="hint">Tax is added on top of what you enter when you buy materials, so the app can track the tax you paid. You can change this for each material.</div><label class="check"><input type="checkbox" id="tCosts" ${s.taxInCosts?'checked':''}> Include tax in material costs</label><div class="hint">Leave this on if you’re not registered for HST and can’t claim back the tax you pay on supplies. Product costs, suggested prices and profit then use what you actually paid. Turn it off if you claim the tax back. Prices you set yourself don’t change.</div>${taxExample()}<label class="check"><input type="checkbox" id="tSales" ${s.taxOnSales?'checked':''}> Add tax to my selling prices</label><div class="hint">Tax is added at market checkout and tracked as tax collected. You can change this for each product.</div><div class="actions"><button onclick="saveTaxSettings()">Save</button></div></div><p class="hint" style="margin:0 6px">Tax totals are shown in Reports by calendar year. They're a guide only, not tax advice.</p>`}
function saveTaxSettings(){let v=$('tRate').value.trim(),r=Number(v);if(v===''||!(r>=0&&r<=100))return needField('tRate','Enter a tax rate between 0 and 100.');Object.assign(data.settings,{taxRate:r,taxOnPurchases:$('tPurch').checked,taxOnSales:$('tSales').checked,taxInCosts:$('tCosts').checked});save();goBack();toast('Tax settings saved.')}
function logPurchase(m,packs,price){packs=Number(packs)||0;if(!m||packs<=0)return;let pr=num(price??m.price),taxed=m.taxed??data.settings.taxOnPurchases;data.purchases.push({id:id(),materialId:m.id,date:new Date().toISOString(),packs,price:pr,taxed:!!taxed,rate:taxRate(),tax:taxed?round2(packs*pr*taxRate()/100):0,store:m.store||''})}
function productTaxed(p){return p?.taxed??data.settings.taxOnSales}
let taxYear=new Date().getFullYear();
function taxYears(){let ys=new Set([new Date().getFullYear()]);for(let x of data.purchases)ys.add(new Date(x.date).getFullYear());for(let x of data.sales)if(num(x.tax))ys.add(new Date(x.date).getFullYear());return [...ys].sort((a,b)=>b-a)}
function taxPanel(){let ys=taxYears();if(!ys.includes(taxYear))taxYear=ys[0];const inY=d=>new Date(d).getFullYear()===taxYear;let spent=data.purchases.filter(x=>inY(x.date)).reduce((a,x)=>a+num(x.tax),0),coll=data.sales.filter(x=>inY(x.date)).reduce((a,x)=>a+num(x.tax),0),diff=coll-spent;return `<div class="panel"><div class="row"><h3 style="margin:0">Sales tax</h3><select id="taxYear" style="width:auto;min-width:110px" aria-label="Tax year" onchange="taxYear=Number(this.value);render()">${ys.map(y=>`<option value="${y}" ${y===taxYear?'selected':''}>${y}</option>`).join('')}</select></div><div class="grid keep2" style="margin-top:12px"><div><div class="muted">Tax collected</div><div class="stat">${cash(coll)}</div></div><div><div class="muted">Tax paid on materials</div><div class="stat">${cash(spent)}</div></div><div class="wide"><div class="muted">Difference (collected − paid)</div><div class="stat ${diff<0?'bad':''}">${signedCash(diff)}</div></div></div><p class="hint">Jan 1 – Dec 31, ${taxYear}. Counts every sale and material purchase dated in that year, whether or not the market is completed. If you're registered for HST, the difference is roughly what you'd remit. A guide only; check with an accountant or the CRA.</p></div>`}
function openAddToCategory(pid){let pr=product(pid);if(!pr)return;let cats=data.productCategories.slice().sort(byName);openModal(`<div class="row"><h2 style="margin:0">Add to category</h2>${closeX()}</div><p class="muted">${esc(pr.name)}</p>${cats.map(c=>`<button class="rowbtn" onclick="setProductCategory('${pid}','${c.id}')"><div class="row"><b>${ic('folder',16)} ${esc(c.name)}</b><span class="muted">${data.products.filter(x=>x.categoryId===c.id).length}</span></div></button>`).join('')||'<p class="muted">No categories yet.</p>'}<label for="ncName">${cats.length?'Or create a new category':'Create a category'}</label><div class="row"><input id="ncName" placeholder="e.g. Plushies, Wearables" autocapitalize="words" onkeydown="if(event.key==='Enter')createAndAssign('${pid}')"><button onclick="createAndAssign('${pid}')">Add</button></div>`)}

function unitSelect(sid,sel){return `<select id="${sid}" data-prev="${esc(sel)}" onchange="unitChanged('${sid}')">${data.units.map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${esc(u.name)} (${esc(u.short)})</option>`).join('')}<option value="__new">+ Add a new unit…</option></select>`}
function unitNewBox(sid){return `<div id="${sid}New" class="newunit hidden"><div class="two"><div><label for="${sid}NewName">Unit name</label><input id="${sid}NewName" placeholder="e.g. yards"></div><div><label for="${sid}NewShort">Short form</label><input id="${sid}NewShort" placeholder="e.g. yd"></div></div><div class="actions"><button type="button" class="small" onclick="addUnitFrom('${sid}')">Add unit</button><button type="button" class="alt small" onclick="cancelNewUnit('${sid}')">Cancel</button></div></div>`}
function unitChanged(sid){let el=$(sid);if(el.value==='__new'){$(sid+'New')?.classList.remove('hidden');$(sid+'NewName')?.focus()}else{el.dataset.prev=el.value;$(sid+'New')?.classList.add('hidden');if(sid==='munit'){let d=$('mstockDisplay');if(d)d.textContent=num(material(editing)?.stock)+' '+unitShort(el.value)}}}
function cancelNewUnit(sid){let el=$(sid);el.value=el.dataset.prev||data.units[0].id;$(sid+'New')?.classList.add('hidden')}
function createUnit(name,short){name=normName(name);short=normName(short)||name;if(!name)return null;let ex=data.units.find(u=>u.name.toLowerCase()===name.toLowerCase()||u.short.toLowerCase()===short.toLowerCase());if(ex)return ex;let u={id:'u_'+id(),name,short};data.units.push(u);save();return u}
function addUnitFrom(sid){let u=createUnit($(sid+'NewName').value,$(sid+'NewShort').value);if(!u)return appAlert('Enter a unit name, e.g. yards.');$(sid).outerHTML=unitSelect(sid,u.id);$(sid+'New').classList.add('hidden');$(sid+'NewName').value='';$(sid+'NewShort').value='';flash(`Unit “${u.name}” ready to use.`)}
function unitInUse(u){return data.materials.some(m=>m.unit===u.id)||data.materialCategories.some(c=>c.unit===u.id)}
function openUnitsModal(){openModal(`<div class="row"><h2 style="margin:0">Units</h2>${closeX()}</div><p class="muted">Units are how materials are measured. Add your own for other crafts, like yards, metres or skeins.</p>${data.units.map(u=>`<div class="row entry" style="margin:6px 0"><span><b>${esc(u.name)}</b> <span class="muted">(${esc(u.short)})</span></span>${u.builtin?'<span class="chip">Built-in</span>':unitInUse(u)?'<span class="chip">In use</span>':`<button class="danger small" onclick="deleteUnit('${u.id}')">Delete</button>`}</div>`).join('')}<h3 style="margin-top:18px">Add a unit</h3><div class="two"><div><label for="nuName">Unit name</label><input id="nuName" placeholder="e.g. yards"></div><div><label for="nuShort">Short form</label><input id="nuShort" placeholder="e.g. yd"></div></div><div class="actions"><button onclick="addUnitModal()">Add unit</button></div>`)}
function addUnitModal(){let nm=$('nuName').value;if(!normName(nm))return appAlert('Enter a unit name, e.g. yards.');let before=data.units.length,u=createUnit(nm,$('nuShort').value);if(screen==='materials')render();openUnitsModal();flash(data.units.length>before?`Unit “${u.name}” added.`:`“${u.name}” already exists.`)}
async function deleteUnit(uid){let u=unitObj(uid);if(!u||u.builtin||unitInUse(u))return;if(!await appConfirm(`Delete the unit “${u.name}”?`))return;data.units=data.units.filter(x=>x.id!==uid);save();if(screen==='materials')render();openUnitsModal()}
let matCatFromForm=false;
function openMatCategoryModal(cid,fromForm){matCatFromForm=!!fromForm;let c=mcat(cid),count=c?data.materials.filter(m=>m.categoryId===c.id).length:0;openModal(`<div class="row"><h2 style="margin:0">${c?'Edit':'New'} material category</h2>${closeX()}</div><label for="mcName">Category name</label><input id="mcName" value="${esc(c?.name||'')}" placeholder="e.g. Beads, Fabric, Buttons"><label for="mcUnit">Usually measured in</label>${unitSelect('mcUnit',c?.unit||'g')}${unitNewBox('mcUnit')}<label class="check"><input type="checkbox" id="mcOn" ${!c||c.onProducts?'checked':''}> Show on every new product</label><p class="hint">Turn this off for things you only use sometimes. You can still add it to any product with the buttons under “Need something else?”.</p><div class="actions"><button onclick="saveMatCategory('${c?.id||''}')">Save</button>${c?`<button class="danger" onclick="deleteMatCategory('${c.id}')">Delete</button>`:''}</div>${c&&count?`<p class="hint">${count} material${count>1?'s':''} in this category. Renaming keeps them all.</p>`:''}`);setTimeout(()=>{if(!c)$('mcName')?.focus()},60)}
function saveMatCategory(cid){let name=normName($('mcName').value),unit=$('mcUnit').value;if(!name)return appAlert('Enter a category name.');if(unit==='__new')return appAlert('Finish adding the new unit first (tap Add unit).');let dup=data.materialCategories.find(c=>c.id!==cid&&c.name.toLowerCase()===name.toLowerCase());if(dup)return appAlert(`You already have a “${dup.name}” category.`);let c=mcat(cid);if(c)Object.assign(c,{name,unit,onProducts:$('mcOn').checked});else{c={id:'mc_'+id(),name,unit,onProducts:$('mcOn').checked};data.materialCategories.push(c)}save();closeModal();if(matCatFromForm&&screen==='productForm'){if(!productSecs.includes(c.id))productSecs.push(c.id);if(!productLines.some(l=>l.catId===c.id))productLines.push({key:id(),catId:c.id,materialId:'',amount:''});redrawSupplies();flash(`“${name}” added to this product.`)}else{materialCatId=c.id;render();flash(`Category “${name}” saved.`)}}
async function deleteMatCategory(cid){let c=mcat(cid),n=data.materials.filter(m=>m.categoryId===cid).length;if(n)return appAlert(`“${c.name}” still has ${n} material${n>1?'s':''}. Move them to another category (open each one → Category) or delete them first.`);if(data.materialCategories.length<2)return appAlert('You need at least one material category.');if(!await appConfirm(`Delete the “${c.name}” category?`))return;data.materialCategories=data.materialCategories.filter(x=>x.id!==cid);save();closeModal();render();flash('Category deleted.')}


function savedStores(){let map=new Map();for(let x of [...data.materials,...data.purchases]){let v=normName(x.store);if(v&&!map.has(v.toLowerCase()))map.set(v.toLowerCase(),v)}return [...map.values()].sort((a,b)=>a.localeCompare(b))}
function canonStore(v){v=normName(v);if(!v)return '';return savedStores().find(x=>x.toLowerCase()===v.toLowerCase())||v}
function storeField(fid,val){return comboField({id:fid,value:val,placeholder:'e.g. Michaels, Walmart, Amazon',autocap:true,source:()=>savedStores().map(x=>({label:x,sub:`${data.materials.filter(m=>normName(m.store).toLowerCase()===x.toLowerCase()).length} material(s)`}))})}
let materialSort='type';const MAT_SORTS=[['type','Sort: Type (A–Z)'],['variation','Sort: Variation (A–Z)'],['priceLow','Sort: Price, low to high'],['priceHigh','Sort: Price, high to low'],['store','Sort: Where purchased']];
function sortMaterials(list){let L=list.slice(),lab=m=>materialLabel(m).toLowerCase();if(materialSort==='variation')L.sort((a,b)=>String(a.colour||'~').localeCompare(String(b.colour||'~'))||lab(a).localeCompare(lab(b)));else if(materialSort==='priceLow')L.sort((a,b)=>num(a.price)-num(b.price)||lab(a).localeCompare(lab(b)));else if(materialSort==='priceHigh')L.sort((a,b)=>num(b.price)-num(a.price)||lab(a).localeCompare(lab(b)));else if(materialSort==='store')L.sort((a,b)=>(normName(a.store)||'~').localeCompare(normName(b.store)||'~')||lab(a).localeCompare(lab(b)));else L.sort((a,b)=>lab(a).localeCompare(lab(b)));return L}
function flatMaterialList(list,showCat){let L=sortMaterials(list);if(materialSort!=='store')return L.map(m=>materialCard(m,showCat?'full':'label')).join('');let out='',last=null;for(let m of L){let st=normName(m.store)||'No store set';if(st!==last){out+=`<div class="section-label">${esc(st)}</div>`;last=st}out+=materialCard(m,showCat?'full':'label')}return out}

let materialCatId=null,matGroupOpen=new Set(),matGroupInfo=[];
function gkey(cid,name){return cid+'|'+normName(name).toLowerCase()}
function materials(){let cats=data.materialCategories;if(!cats.some(c=>c.id===materialCatId))materialCatId=cats[0]?.id;return `<div class="row"><h2>Materials</h2></div><div class="actions toprow" style="margin:-6px 0 12px"><button onclick="newMaterial('${materialCatId||''}')">+ Material</button><button class="alt" onclick="openMatCategoryModal()">+ Category</button><button class="alt" onclick="openUnitsModal()">Units</button></div><input id="materialSearch" placeholder="Search materials (type, variation, store)" value="${esc(materialSearch)}" oninput="materialSearch=this.value;drawMaterialRows()"><label for="matSort" class="sr">Sort materials</label><select id="matSort" style="margin-top:10px" onchange="materialSort=this.value;drawMaterialRows()">${MAT_SORTS.map(([v,l])=>`<option value="${v}" ${materialSort===v?'selected':''}>${l}</option>`).join('')}</select><div class="tabs" style="margin-top:12px">${cats.map(x=>`<button class="${x.id===materialCatId?'':'alt'} small" onclick="materialCatId='${x.id}';render()">${esc(x.name)}</button>`).join('')}</div><div id="materialRows">${materialRows()}</div>`}
function materialCard(m,mode){let c=mcat(m.categoryId),isDef=c?.defaultMaterialId===m.id,full=mode===true||mode==='full';return `<div class="panel row matcard">${photoSlot(m.photo||m.photos?.[0]||'',"width:52px;height:52px",'material',m.id,materialLabel(m),true)}<div class="grow"><b>${esc(mode&&mode!=='group'?materialLabel(m):(m.colour||'No variation set'))}</b>${isDef?' <span class="chip">Default</span>':''}<div class="muted">${full?esc(c?.name||'')+' · ':''}${m.store&&materialSort!=='store'?esc(m.store)+' · ':''}${cash(m.price)} / ${num(m.weight)} ${esc(unitShort(m.unit))}${m.trackStock?` · ${num(m.stock)} ${esc(unitShort(m.unit))} left`:''}</div></div><button class="alt small" onclick="editMaterial('${m.id}')">Edit</button></div>`}
function materialRows(){let q=materialSearch.toLowerCase().trim();if(q){let hits=data.materials.filter(m=>[m.name,m.colour,m.store,mcat(m.categoryId)?.name].some(x=>String(x||'').toLowerCase().includes(q))).sort((a,b)=>materialLabel(a).localeCompare(materialLabel(b)));return flatMaterialList(hits,true)||'<div class="panel muted">No materials match your search.</div>'}let c=mcat(materialCatId);if(!c)return '';let groups=new Map();for(let m of data.materials.filter(m=>m.categoryId===c.id)){let k=gkey(c.id,m.name);if(!groups.has(k))groups.set(k,{key:k,catId:c.id,name:normName(m.name),items:[]});groups.get(k).items.push(m)}matGroupInfo=[...groups.values()].sort(byName);let dm=material(c.defaultMaterialId),inCat=data.materials.filter(m=>m.categoryId===c.id),head=`<div class="cat-head"><div class="muted">Measured in ${esc(unitName(c.unit))} · ${c.onProducts?'on every new product':'added to products when needed'}${dm?`<br>Default: <b>${esc(materialLabel(dm))}</b>`:''}</div><button class="alt small" onclick="openMatCategoryModal('${c.id}')">Edit category</button></div>`;if(materialSort!=='type')return head+(flatMaterialList(inCat,false)||`<div class="panel muted">No ${esc(c.name.toLowerCase())} saved yet. Tap + Material to add one.</div>`);return head+(matGroupInfo.map((g,i)=>{let open=matGroupOpen.has(g.key),n=g.items.length,photo=g.items.map(m=>m.photo||m.photos?.[0]).find(Boolean)||'';g.items.sort((a,b)=>String(a.colour||'').localeCompare(String(b.colour||''),undefined,{numeric:true,sensitivity:'base'}));return `<div class="folder ${open?'open':''}"><button class="folder-head" onclick="toggleMatGroup(${i})" aria-expanded="${open}">${photoSlot(photo,'width:46px;height:46px','group',i,g.name,true)}<span class="grow"><b>${esc(g.name)}</b><span class="muted">${n} variation${n>1?'s':''}${g.items.some(m=>c.defaultMaterialId===m.id)?' · default inside':''}</span></span><span class="chev" aria-hidden="true">›</span></button>${open?`<div class="folder-body">${g.items.map(m=>materialCard(m,'group')).join('')}<div class="actions" style="margin:6px 0 2px"><button class="alt small" onclick="addToMatGroup(${i})">+ Add variation</button><button class="alt small" onclick="renameMatGroup(${i})">Rename</button></div></div>`:''}</div>`}).join('')||`<div class="panel muted">No ${esc(c.name.toLowerCase())} saved yet. Tap + Material to add one.</div>`)}
function toggleMatGroup(i){let k=matGroupInfo[i]?.key;if(!k)return;matGroupOpen.has(k)?matGroupOpen.delete(k):matGroupOpen.add(k);drawMaterialRows()}
function addToMatGroup(i){let g=matGroupInfo[i];if(g)newMaterial(g.catId,g.name)}
function renameMatGroup(i){let g=matGroupInfo[i];if(!g)return;openModal(`<div class="row"><h2 style="margin:0">Rename type</h2>${closeX()}</div><p class="muted">This renames all ${g.items.length} variation${g.items.length>1?'s':''} of ${esc(g.name)}.</p><label for="rgName">Type / brand name</label><input id="rgName" value="${esc(g.name)}"><div class="actions"><button onclick="saveMatGroupName(${i})">Save</button></div>`)}
function saveMatGroupName(i){let g=matGroupInfo[i],nm=normName($('rgName').value);if(!g||!nm)return appAlert('Enter a name.');let canon=data.materials.find(m=>m.categoryId===g.catId&&gkey(g.catId,m.name)!==g.key&&normName(m.name).toLowerCase()===nm.toLowerCase());nm=canon?normName(canon.name):nm;for(let m of data.materials)if(m.categoryId===g.catId&&gkey(g.catId,m.name)===g.key)m.name=nm;matGroupOpen.delete(g.key);matGroupOpen.add(gkey(g.catId,nm));save();closeModal();drawMaterialRows();flash(canon?`Merged into ${nm}.`:`Renamed to ${nm}.`)}

let materialPreset=null,quickTarget=null,quickCatId=null;
function suggestionInputs(prefix,name='',colour=''){const cid=()=>prefix==='m'?$('mcat')?.value:quickCatId;const nameNow=()=>normName($(prefix+'name')?.value).toLowerCase();return `<label for="${prefix}name">Type / brand</label>${comboField({id:prefix+'name',value:name,placeholder:'Start typing, e.g. Bernat Blanket',autocap:true,source:()=>savedValues(cid(),'name').map(x=>({label:x.label,sub:`${x.count} variation${x.count>1?'s':''} saved`})),onPick:()=>fillFromSibling(prefix)})}<div class="hint" style="margin-top:5px">All variations of the same type are grouped together on the Materials page.</div><label for="${prefix}colour">Variation (optional)</label>${comboField({id:prefix+'colour',value:colour,placeholder:'e.g. Lilac, 12 mm, Large',autocap:true,source:()=>savedValues(cid(),'colour').map(x=>({label:x.label,sub:data.materials.some(m=>m.categoryId===cid()&&normName(m.name).toLowerCase()===nameNow()&&normName(m.colour).toLowerCase()===x.label.toLowerCase())?'Already saved with this type':''}))})}`}
function fillFromSibling(prefix){if(prefix==='m'&&editing)return;let cid=prefix==='m'?$('mcat')?.value:quickCatId,nm=normName($(prefix+'name')?.value).toLowerCase(),sib=data.materials.find(m=>m.categoryId===cid&&normName(m.name).toLowerCase()===nm);if(!sib)return;let pr=$(prefix+'price');if(pr&&pr.value===''){pr.value=sib.price;let w=$(prefix+'weight');if(w)w.value=sib.weight;let u=$(prefix+'unit');if(u&&unitObj(sib.unit)){u.value=sib.unit;u.dataset.prev=sib.unit}let st=$(prefix+'store');if(st&&!st.value&&sib.store)st.value=sib.store}}

function setMaterialFormDefaults(){}
function newMaterial(catId,name){go('materialForm',()=>{editing=null;materialPhotos=[];materialPreset={catId:catId||materialCatId||data.materialCategories[0]?.id,name:name||''}})}
function editMaterial(mid){go('materialForm',()=>{editing=mid;let m=material(mid);materialPhotos=[...(m?.photos||(m?.photo?[m.photo]:[]))];materialPreset=null})}
function materialForm(){let m=material(editing)||{},catId=m.categoryId||materialPreset?.catId||data.materialCategories[0]?.id,c=mcat(catId),presetName=m.name||materialPreset?.name||'',sib=!editing&&presetName?data.materials.find(x=>x.categoryId===catId&&normName(x.name).toLowerCase()===presetName.toLowerCase()):null,unit=m.unit||sib?.unit||c?.unit||'g';return `${backBtn()}<div class="panel" style="margin-top:12px"><h2>${editing?'Edit':'Add'} material</h2><form novalidate onsubmit="saveMaterial(event)"><label for="mcat">Category</label><select id="mcat" onchange="materialCatChanged()">${data.materialCategories.map(x=>`<option value="${x.id}" ${x.id===catId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${suggestionInputs('m',presetName,m.colour||'')}<div class="two"><div><label for="mweight">Package size</label><input id="mweight" type="number" min="0.001" step="any" required value="${m.weight??sib?.weight??(unit==='g'?100:1)}"></div><div><label for="munit">Unit</label>${unitSelect('munit',unit)}</div></div>${unitNewBox('munit')}<label for="mprice">Price paid per package ($)</label><input id="mprice" type="number" min="0" step="0.01" inputmode="decimal" required value="${m.price??sib?.price??''}"><label class="check"><input id="mtaxed" type="checkbox" ${(m.taxed??sib?.taxed??data.settings.taxOnPurchases)?'checked':''}> This price is before tax (adds ${num(data.settings.taxRate)}%)</label><label for="mstore">Where purchased (optional)</label>${storeField('mstore',m.store??sib?.store??'')}<label class="check"><input id="mtrack" type="checkbox" ${(m.trackStock??sib?.trackStock)?'checked':''}> Track remaining stock ${stockHelpButton()}</label><div class="hint">Optional: when on, the app tracks how much of this material is left. Making finished products only deducts it if automatic deductions are on in Settings.</div><div class="panel" style="background:var(--card2);margin-top:12px;box-shadow:none"><div class="muted">Current remaining stock</div><div class="big" id="mstockDisplay">${num(m.stock)} ${esc(unitShort(unit))}</div><div class="hint">Changes when you add packages below or when tracked materials are used.</div></div><label for="mpackages">Packages purchased / add to stock</label><div class="row" style="justify-content:flex-start"><button type="button" class="alt" onclick="stepNumber('mpackages',-1)" aria-label="One fewer">−</button><input id="mpackages" type="number" min="0" step="1" value="${editing?0:1}" style="width:90px;text-align:center"><button type="button" class="alt" onclick="stepNumber('mpackages',1)" aria-label="One more">+</button></div><div class="hint">One package holds the package size above. For an existing material, enter how many new packages to add.</div><label>Material photo (optional)</label><div class="actions"><button type="button" class="alt small" onclick="$('mphotoCamera').click()">📷 Camera</button><button type="button" class="alt small" onclick="$('mphotoGallery').click()">▧ Gallery</button></div><input id="mphotoCamera" class="hidden" type="file" accept="image/*" capture="environment" multiple onchange="loadMaterialPhoto(event,false)"><input id="mphotoGallery" class="hidden" type="file" accept="image/*" multiple onchange="loadMaterialPhoto(event,false)"><div id="materialPhotoPreview">${photoGallery("material")}</div><label class="check"><input type="checkbox" id="mdefault" ${editing&&c?.defaultMaterialId===m.id?'checked':''}> <span>Make this the default <span id="mdefaultCat">${esc((c?.name||'material').toLowerCase())}</span></span></label><div class="hint">The default is filled in for you whenever you create a new product.</div><div class="actions"><button type="submit">Save material</button>${editing?`<button type="button" class="danger" onclick="deleteMaterial('${editing}')">Delete</button>`:''}</div></form></div>`}
function materialCatChanged(){comboClose('mname');comboClose('mcolour');let dc=$('mdefaultCat');if(dc)dc.textContent=(mcat($('mcat').value)?.name||'material').toLowerCase();if(editing)return;let c=mcat($('mcat').value),u=$('munit');if(c&&u&&unitObj(c.unit)){u.value=c.unit;u.dataset.prev=c.unit}}
async function saveMaterial(e){e.preventDefault();let catId=$('mcat').value,c=mcat(catId),unit=$('munit').value,packs=Number($('mpackages').value),weight=num($('mweight').value),name=canonical(catId,'name',$('mname').value),colour=canonical(catId,'colour',$('mcolour').value);if(unit==='__new')return needField('munitNewName','Finish adding the new unit first (tap Add unit).');if(!name)return needField('mname','Enter a type or brand name, e.g. Polyfill.');if(!(weight>0))return needField('mweight','Enter the package size (more than 0).');if($('mprice').value.trim()===''||!(Number($('mprice').value)>=0))return needField('mprice','Enter the price you paid per package. Use 0 if it was free.');if(!Number.isInteger(packs)||packs<0)return needField('mpackages','Enter a whole number of packages (0 or more).');let dup=findDuplicateMaterial(catId,name,colour,editing),label=name+(colour?' — '+colour:'');if(dup){if(editing||packs<1)return appAlert(`You already have ${label} saved. Change the type or variation, or edit the saved one instead.`);if(!await appConfirm(`You already have ${label} saved.\n\nAdd ${packs} package${packs>1?'s':''} to its stock instead of saving it twice?`))return;dup.stock=num(dup.stock)+packs*num(dup.weight);logPurchase(dup,packs,num($('mprice').value));matGroupOpen.add(gkey(catId,name));save();goBack();return toast(`Added to ${label}.`)}let m={id:editing||id(),categoryId:catId,name,colour,weight,unit,price:num($('mprice').value),store:canonStore($('mstore').value),taxed:$('mtaxed').checked,trackStock:$('mtrack').checked,photo:materialPhotos[0]||'',photos:[...materialPhotos],stock:(editing?num(material(editing)?.stock):0)+packs*weight};if(editing)Object.assign(material(editing),m);else data.materials.push(m);logPurchase(material(m.id),packs);for(let x of data.materialCategories)if(x.defaultMaterialId===m.id&&(x.id!==catId||!$('mdefault').checked))x.defaultMaterialId='';if($('mdefault').checked)c.defaultMaterialId=m.id;matGroupOpen.add(gkey(catId,name));mat async function fileUp(p){await sbFetch(`/storage/v1/object/${SB_BUCKET}/${filePath(p.id)}`,{method:'POST',headers:{'Content-Type':p.mime||p.blob.type||'application/octet-stream','x-upsert':'true'},body:p.blob})}
async function fileDown(pid,mime){let r=await sbFetch(`/storage/v1/object/authenticated/${SB_BUCKET}/${filePath(pid)}`,{raw:true});let b=await r.blob();return mime?new Blob([b],{type:mime}):b}
async function fileDel(paths){if(paths.length)await sbFetch(`/storage/v1/object/${SB_BUCKET}`,{method:'DELETE',body:{prefixes:paths}})}
async function fileListAll(){let r=await sbFetch(`/storage/v1/object/list/${SB_BUCKET}`,{method:'POST',body:{prefix:session.user.id+'/patterns/',limit:1000,offset:0}});return (r||[]).filter(o=>o.name).map(o=>`${session.user.id}/patterns/${o.name}`)}

// ---- Change tracking (hooks into saving) ----
const _flushSave=flushSave,_pdfPut=pdfPut,_pdfDelete=pdfDelete;
flushSave=function(){let q=_flushSave();markDirty();return q};
pdfPut=async function(v){await _pdfPut(v);markDirty()};
pdfDelete=async function(pid){await _pdfDelete(pid);if(!applyingRemote&&syncMeta.userId){syncMeta.pats=syncMeta.pats||{};if(syncMeta.pats[pid]){(syncMeta.del=syncMeta.del||[]).push(pid);delete syncMeta.pats[pid]}saveSyncMeta()}markDirty()};
function markDirty(){if(applyingRemote||!syncMeta.userId)return;syncMeta.dirty=true;syncMeta.dirtyAt=new Date().toISOString();saveSyncMeta();schedulePush()}
function schedulePush(ms=3000){if(!signedIn())return;clearTimeout(pushTimer);pushTimer=setTimeout(syncNow,ms)}

// ---- Sync engine ----
function syncNow(){
  clearTimeout(pushTimer);
  if(syncBusy){syncAgain=true;return syncBusy}
  syncBusy=(async()=>{try{do{syncAgain=false;await syncOnce()}while(syncAgain)}finally{syncBusy=null}})();
  return syncBusy
}
async function syncOnce(){
  if(!signedIn()||syncMeta.userId!==session.user.id)return;
  if(!navigator.onLine)return setSync('offline');
  setSync('syncing');
  try{
    if(Date.now()-lastUserCheck>60000){
      try{await sbFetch('/auth/v1/user');lastUserCheck=Date.now()}
      catch(e){if(e.code==='user_not_found'||/does not exist|not found/i.test(e.message)||e.status===404){setSync('idle');return lostAccount('deleted')}throw e}
    }
    let head=await cloudHead(),remoteAt=tms(head?.updated_at);
    if(head&&remoteAt>tms(syncMeta.lastServerAt)&&!(syncMeta.dirty&&tms(syncMeta.dirtyAt)>remoteAt))await pullApply();
    else if((syncMeta.retry||[]).length)await retryDownloads();
    if(syncMeta.dirty)await pushAll();
    syncMeta.lastOkAt=Date.now();saveSyncMeta();setSync('ok')
  }catch(e){console.warn('Sync',e);setSync(e.code==='network'?'offline':'error',friendlyAuth(e))}
}
async function pushAll(onProgress){
  syncMeta.pats=syncMeta.pats||{};syncMeta.del=syncMeta.del||[];
  let startedAt=syncMeta.dirtyAt;
  if(syncMeta.del.length){await fileDel(syncMeta.del.map(filePath));syncMeta.del=[];saveSyncMeta()}
  let local=await pdfAll(),up=local.filter(p=>!syncMeta.pats[p.id]&&p.blob),i=0;
  onProgress?.(0,up.length);
  for(let p of up){
    try{await fileUp(p);syncMeta.pats[p.id]=1}
    catch(e){if(e.code==='network'||e.status===401||e.status>=500)throw e;console.warn('Upload skipped',p.name,e);syncMeta.pats[p.id]='skip';flash(`“${p.name}” is too large to save to your account. It stays on this phone.`)}
    saveSyncMeta();onProgress?.(++i,up.length)
  }
  let at=new Date().toISOString();
  await cloudPut({...data,_patterns:local.filter(p=>syncMeta.pats[p.id]===1).map(patMeta)},at);
  syncMeta.lastServerAt=at;if(syncMeta.dirtyAt===startedAt)syncMeta.dirty=false;saveSyncMeta()
}
async function pullApply(row,onProgress){
  row=row||await cloudGet();if(!row)return;
  let d={...(row.data||{})},pats=Array.isArray(d._patterns)?d._patterns:[];delete d._patterns;
  syncMeta.pats=syncMeta.pats||{};
  applyingRemote=true;
  try{
    data=normalizeData(d);
    await (saveQueue=saveQueue.then(()=>idbSet('app','data',data)));
    let local=await pdfAll(),byId=Object.fromEntries(local.map(p=>[p.id,p])),cloudIds=new Set(pats.map(p=>p.id));
    for(let p of local)if(!cloudIds.has(p.id)&&syncMeta.pats[p.id]===1){await _pdfDelete(p.id);delete syncMeta.pats[p.id]}
    for(let m of pats){let l=byId[m.id];if(!l)continue;syncMeta.pats[m.id]=1;if(l.name!==m.name||(m.thumb&&l.thumb!==m.thumb))await _pdfPut({...l,name:m.name,thumb:m.thumb||l.thumb,thumbCustom:!!m.thumbCustom,thumbTried:true})}
    syncMeta.retry=pats.filter(m=>!byId[m.id]);
    syncMeta.lastServerAt=row.updated_at;syncMeta.dirty=false;
    if(local.some(p=>!cloudIds.has(p.id)&&!syncMeta.pats[p.id])){syncMeta.dirty=true;syncMeta.dirtyAt=new Date().toISOString()}
    saveSyncMeta();
  }finally{applyingRemote=false}
  await refreshPdfs();
  onProgress?.(0,syncMeta.retry.length);
  await retryDownloads(onProgress);
  softRender()
}
async function retryDownloads(onProgress){
  let list=syncMeta.retry||[],i=0;
  for(let m of list.slice()){
    try{
      let blob=await fileDown(m.id,m.mime);
      applyingRemote=true;try{await _pdfPut({id:m.id,name:m.name,date:m.date,mime:m.mime,thumb:m.thumb||'',thumbCustom:!!m.thumbCustom,thumbTried:!!m.thumb,blob})}finally{applyingRemote=false}
      syncMeta.pats[m.id]=1;syncMeta.retry=syncMeta.retry.filter(x=>x.id!==m.id);saveSyncMeta()
    }catch(e){if(e.code==='network')throw e;console.warn('Pattern download',m.name,e)}
    onProgress?.(++i,list.length)
  }
  if(list.length)await refreshPdfs()
}
function isBusyScreen(){let a=document.activeElement;return /^auth/.test(screen)||['productForm','materialForm','marketForm','marketInfo','marketTodo','settingsPricing','settingsTax','settingsAccount'].includes(screen)||marketSaleMode||!!$('modal')||!!$('appDialog')||!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}
function softRender(){if(isBusyScreen())return;try{render()}catch(e){console.warn(e);view('home')}}
function ago(t){let s=(Date.now()-t)/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';return new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function syncText(){
  if(!signedIn())return '';
  if(syncMeta.userId!==session.user.id)return 'Setup not finished';
  if(syncState==='syncing')return 'Syncing…';
  if(syncState==='offline')return 'Offline · changes are saved on this phone and will sync later';
  if(syncState==='error')return "Couldn't reach the cloud · your changes are saved on this phone";
  if(syncMeta.dirty)return 'Waiting to sync…';
  return syncMeta.lastOkAt?'All synced · '+ago(syncMeta.lastOkAt):'Not synced yet'
}
function syncStripInner(){let ready=signedIn()&&syncMeta.userId===session.user.id;return `${ic(syncState==='ok'&&!syncMeta.dirty?'cloud':'sync',20)}<span class="grow">${esc(syncText())}</span>${ready?(syncState==='syncing'?'':'<button class="small alt" onclick="syncNow()">Sync now</button>'):'<button class="small" onclick="afterAuth()">Finish setup</button>'}`}
function setSync(s,msg){syncState=s;syncError=msg||'';let e=$('syncStatus');if(e)e.innerHTML=syncStripInner()}
addEventListener('online',()=>syncNow());
addEventListener('offline',()=>setSync('offline'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'||syncMeta.dirty)syncNow()});
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},120000);

// ---- Local data helpers ----
function countsOf(){let ph=0;for(let x of [...data.products,...data.materials])ph+=Array.isArray(x.photos)&&x.photos.length?x.photos.length:(x.photo?1:0);return {products:data.products.length,materials:data.materials.length,markets:data.markets.length,sales:data.sales.length,photos:ph,patterns:pdfCache.length}}
function hasLocalData(){let c=countsOf();return !!(c.products||c.materials||c.markets||c.sales||c.patterns)}
function localSummary(){let c=countsOf();return [[c.products,'product'],[c.materials,'material'],[c.patterns,'pattern'],[c.markets,'market']].filter(x=>x[0]).map(([n,w])=>`${n} ${w}${n===1?'':'s'}`).join(', ')||'some data'}
async function clearLocal(){clearTimeout(saveTimer);saveTimer=null;clearTimeout(pushTimer);await saveQueue;applyingRemote=true;try{await idbDel('app','data');for(let p of await pdfAll())await _pdfDelete(p.id)}finally{applyingRemote=false}}

// ---- Flow ----
async function busy(fn){if(authBusy)return;authBusy=true;document.body.classList.add('busy');try{await fn()}catch(e){console.warn(e);await appAlert(friendlyAuth(e))}finally{authBusy=false;document.body.classList.remove('busy')}}
function authSwap(s){let em=$('suEmail')||$('siEmail')||$('fpEmail');if(em)authFlow.email=em.value.trim();screen=s;render();scrollTo(0,0)}
function useLocalOnly(){lsSet('csLocalOnly',true);view('home')}
function soon(n){flash(`${n} sign-in is coming soon. Use email for now.`)}
async function afterAuth(){
  if(!signedIn())return view('authWelcome');
  let uid=session.user.id;await refreshPdfs();
  if(syncMeta.userId===uid){lsSet('csLocalOnly',null);view('home');syncNow();return}
  let row;
  try{row=await cloudGet()}catch(e){await appAlert(friendlyAuth(e)+'\n\nYou can finish setting up later in Settings › Account.');if(/^auth/.test(screen))view('home');return}
  if(row){
    if(hasLocalData()){
      let useCloud=await appDialog({title:'This phone already has data',message:`Your account already has saved data, and this phone has its own (${localSummary()}).\n\nUse your account's data on this phone? The phone's current data will be replaced.`,ok:"Use account's data",cancel:"Keep this phone's"});
      if(!useCloud){if(!await appConfirm("Replace everything saved in your account with this phone's data? This changes it on all your devices.",{ok:'Replace account data',danger:true}))return afterAuth();return startUpload()}
    }
    return startDownload(row)
  }
  view('authSetup')
}
async function startUpload(){
  syncMeta={userId:session.user.id,pats:{},del:[],dirty:true,dirtyAt:new Date().toISOString()};saveSyncMeta();lsSet('csLocalOnly',null);
  syncView={mode:'up',phase:'patterns',i:0,n:pdfCache.length};view('authSync');
  await runSyncView(()=>pushAll((i,n)=>{syncView.i=i;syncView.n=n;drawSync()}))
}
async function startDownload(row){
  applyingRemote=true;try{for(let p of await pdfAll())await _pdfDelete(p.id)}finally{applyingRemote=false}
  await refreshPdfs();
  syncMeta={userId:session.user.id,pats:{},del:[]};saveSyncMeta();lsSet('csLocalOnly',null);
  syncView={mode:'down',phase:'data',i:0,n:(row?.data?._patterns||[]).length};view('authSync');
  await runSyncView(()=>pullApply(row,(i,n)=>{syncView.phase='patterns';syncView.i=i;syncView.n=n;drawSync()}))
}
async function runSyncView(fn){
  try{await fn();syncView.phase='done';syncMeta.lastOkAt=Date.now();saveSyncMeta();setSync('ok')}
  catch(e){console.warn(e);syncView.phase='error';syncView.error=friendlyAuth(e)}
  drawSync()
}
function retrySyncView(){let up=syncView?.mode==='up';syncView={...syncView,phase:up?'patterns':'data',i:0,error:''};drawSync();runSyncView(up?()=>pushAll((i,n)=>{syncView.i=i;syncView.n=n;drawSync()}):()=>pullApply(null,(i,n)=>{syncView.phase='patterns';syncView.i=i;syncView.n=n;drawSync()}))}
function drawSync(){if(screen==='authSync')render()}
function finishAuth(){let nm=data.settings.userName;view('home');flash(nm?`You're all set, ${nm}!`:"You're all set!")}

async function doSignup(){
  let email=$('suEmail').value.trim().toLowerCase(),pw=$('suPass').value;
  if(!/^\S+@\S+\.\S+$/.test(email))return needField('suEmail','Enter your email address.');
  if(pw.length<8)return needField('suPass','Choose a password with at least 8 characters.');
  await busy(async()=>{
    let r=await authApi.signUp(email,pw);authFlow={purpose:'signup',email,pw};
    if(r&&r.access_token){setSession(r);return afterAuth()}
    let u=r?.user||r;
    if(u&&Array.isArray(u.identities)&&!u.identities.length){await appAlert('An account with this email already exists. Sign in instead.');return authSwap('authSignin')}
    go('authVerify')
  })
}
async function doSignin(){
  let email=$('siEmail').value.trim().toLowerCase(),pw=$('siPass').value;
  if(!/^\S+@\S+\.\S+$/.test(email))return needField('siEmail','Enter your email address.');
  if(!pw)return needField('siPass','Enter your password.');
  await busy(async()=>{
    authFlow={purpose:'signin',email};
    try{setSession(await authApi.signIn(email,pw))}
    catch(e){if(e.code==='email_not_confirmed'||/not confirmed/i.test(e.message)){authFlow.purpose='signup';authFlow.pw=pw;try{await authApi.resend(email)}catch{}await appAlert('Please confirm your email first. We just sent you a new email.');return go('authVerify')}throw e}
    await afterAuth()
  })
}
async function doForgot(){
  let email=$('fpEmail').value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email))return needField('fpEmail','Enter the email address you signed up with.');
  await busy(async()=>{await authApi.recover(email);authFlow={purpose:'recovery',email};go('authVerify')})
}
async function doLinkConfirmed(){
  if(!authFlow.pw){await appAlert('Sign in with your email and password to continue.');return authSwap('authSignin')}
  await busy(async()=>{
    try{setSession(await authApi.signIn(authFlow.email,authFlow.pw))}
    catch(e){if(e.code==='email_not_confirmed'||/not confirmed/i.test(e.message))return appAlert("Your email isn't confirmed yet. Open the newest email from Crochet Studio and tap the link in it, then try again.");throw e}
    delete authFlow.pw;await afterAuth()
  })
}
function otpBoxes(){return [...document.querySelectorAll('#otp input')]}
function otpInput(el,e){
  let boxes=otpBoxes(),v=el.value.replace(/\D/g,'');
  if(e&&e.inputType==='insertText'&&v.length===2)v=v.slice(-1);
  if(v.length>1){let i=+el.dataset.i;for(let ch of v){if(i>=boxes.length)break;boxes[i++].value=ch}boxes[Math.min(i,boxes.length-1)].focus()}
  else{el.value=v;if(v&&el.nextElementSibling)el.nextElementSibling.focus()}
  if(boxes.every(b=>b.value))doVerify()
}
function otpKey(e,el){if(e.key==='Backspace'&&!el.value&&el.previousElementSibling){e.preventDefault();el.previousElementSibling.value='';el.previousElementSibling.focus()}}
async function doVerify(){
  let code=otpBoxes().map(b=>b.value).join('');
  if(code.length<OTP_LEN)return appAlert(`Enter the ${OTP_LEN}-digit code from the email.`);
  await busy(async()=>{
    let rec=authFlow.purpose==='recovery',r;
    try{r=await authApi.verify(authFlow.email,code,rec?'recovery':'email')}
    catch(e){if(rec||e.code==='network')throw e;try{r=await authApi.verify(authFlow.email,code,'signup')}catch{throw e}}
    setSession(r);
    if(rec)return view('authNewPassword');
    await afterAuth()
  });
  if(screen==='authVerify'){for(let b of otpBoxes())b.value='';otpBoxes()[0]?.focus()}
}
async function resendCode(){await busy(async()=>{if(authFlow.purpose==='recovery')await authApi.recover(authFlow.email);else await authApi.resend(authFlow.email);flash('A new email is on its way.')})}
async function saveNewPassword(fid,inModal){
  let pw=$(fid).value;if(pw.length<8)return needField(fid,'Choose a password with at least 8 characters.');
  await busy(async()=>{await authApi.updatePassword(pw);if(inModal){closeModal();flash('Password changed.')}else if(authFlow.viaLink){setSession(null);authFlow={done:'password'};view('authLinkDone')}else{flash('New password saved.');await afterAuth()}})
}
async function finishSetup(mode){

  await (saveQueue=saveQueue.then(()=>idbSet('app','data',data)));

}
function openChangePassword(){openModal(`<div class="row"><h2 style="margin:0">Change password</h2>${closeX()}</div><label for="npw">New password</label>${pwField('npw','new-password',`onkeydown="if(event.key==='Enter')saveNewPassword('npw',true)"`)}<div class="hint">At least 8 characters</div><div class="actions"><button onclick="saveNewPassword('npw',true)">Save password</button></div>`);setTimeout(()=>$('npw')?.focus(),60)}
async function signOut(){
  if(syncMeta.dirty&&navigator.onLine){flash('Syncing your last changes…');await syncNow()}
  let unsynced=syncMeta.dirty;
  if(!await appDialog({title:'Sign out?',message:(unsynced?"Some changes haven't synced yet. If you sign out now they will be lost.\n\n":'')+'Everything is saved in your account. Signing out removes it from this device; sign in again any time to get it back.',ok:'Sign out',cancel:'Cancel',danger:unsynced}))return;
  await authApi.signOut();await clearLocal();setSession(null);syncMeta={};saveSyncMeta();lsSet('csLocalOnly',null);location.reload()
}
async function deleteAccount(){
  if(!await appDialog({title:'Delete your account?',message:'This permanently deletes your account and everything saved in it: products, materials, markets, sales, photos and patterns, on every device.\n\nDownload a backup first (Settings › Backup) if you might want any of it.',ok:'Delete account',cancel:'Cancel',danger:true}))return;

async function authBoot(){
  let h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')||h.get('error_description')){
    try{history.replaceState(null,'',location.pathname+location.search)}catch{}
    if(h.get('error_description'))setTimeout(()=>appAlert((h.get('error_code')==='otp_expired'?'That email link has expired or was already used. ':'')+'Please sign in, or ask for a new code.'),300);
    else{
      let prevSession=session;
      setSession({access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_in:h.get('expires_in'),expires_at:h.get('expires_at'),user:{}});
      try{let u=await sbFetch('/auth/v1/user');if(h.get('type')==='recovery'){session.user={id:u.id,email:u.email};lsSet('csSession',session);authFlow={purpose:'recovery',email:u.email,viaLink:true};screen='authNewPassword';return}lsSet('csLastEmail',u.email);let keep=signedIn()&&session.user.id===u.id&&syncMeta.userId===u.id;if(!keep)setSession(prevSession);authFlow={done:'email',email:u.email};screen='authLinkDone';return}
      catch(e){console.warn(e);setSession(prevSession)}
    }
  }
  if(signedIn()){if(syncMeta.userId===session.user.id){syncNow();return}await afterAuth();return}
  if(!syncMeta.userId&&!lsGet('csLocalOnly',false))screen='authWelcome'
}

// ---- Account deleted / signed out elsewhere ----
async function lostAccount(kind){
  if(lostShown||!syncMeta.userId)return;lostShown=true;
  clearTimeout(pushTimer);let wasDeleted=kind==='deleted';
  if(wasDeleted)setSession(null);
  let remove=await appDialog({title:wasDeleted?'This account was deleted':"You've been signed out",message:(wasDeleted?'It may have been deleted from another device.':'Your account may have been deleted on another device, or your sign-in expired.')+" The data on this phone hasn't been touched.\n\nKeep using it on this phone, or remove it?",ok:'Remove it from this phone',cancel:'Keep it on this phone',danger:true});
  if(remove&&await appConfirm('Remove all products, materials, markets, sales, photos and patterns from this phone? This cannot be undone.',{ok:'Remove',danger:true})){
    await clearLocal();setSession(null);syncMeta={};saveSyncMeta();lsSet('csLocalOnly',null);location.reload();return
  }
  if(wasDeleted){syncMeta={};saveSyncMeta();lsSet('csLocalOnly',true)}
  lostShown=false;setSync('idle');
  if(/^auth/.test(screen))view('home');else softRender();
  flash(wasDeleted?"You're now using the app without an account. Your data is on this phone.":'Your data is on this phone. Sign in again any time in Settings › Account.')
}

const SQ_APP_ID='sq0idp-J4UrXdHeSOnFaEtvwuO2HQ';function sqCurrency(){return data.settings.currency==='USD'?'USD':'CAD'}
const DISCOUNT_REASONS=['Bundle deal','Haggled','Friends & family','Repeat customer','Seconds / flaw','Other'];

Object.assign(ICONS,{card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',receipt:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>'});
let saleKind='market',saleAdj={prices:{},discount:null},payTmp={method:'cash',given:''},discTmp=null,discCtx='draft',priceTmp=null;

const payLabel=k=>(PAY_METHODS.find(x=>x[0]===k)||[,'Not recorded'])[1];
function discountAmount(sub,d){if(!d)return 0;let v=num(d.value),a=d.type==='pct'?sub*Math.min(v,100)/100:d.type==='amt'?v:d.type==='total'?sub-v:0;return round2(Math.max(0,Math.min(sub,a)))}
function discLabel(d,sub){if(!d)return '';let r=d.reason||'Discount';if(d.type==='pct')return `${r} (${num(d.value)}% off)`;let a=discountAmount(sub,d);return sub&&a?`${r} (${Math.round(a/sub*1000)/10}% off)`:r}
function allocate(lines,disc){let sub=lines.reduce((a,l)=>a+l.qty*l.price,0),left=disc;lines.forEach((l,i)=>{let base=l.qty*l.price,share=i===lines.length-1?left:round2(sub?disc*base/sub:0);l.disc=round2(Math.max(0,Math.min(share,base)));left=round2(left-l.disc)})}

  let lines=Object.entries(draft||{}).filter(([,q])=>q>0).map(([pid,q])=>{let p=product(pid),list=num(p?.price),o=adj.prices[pid];return {pid,p,name:p?.name||'Item',qty:q,list,price:o?num(o.price):list,reason:o?.reason||'',taxed:!!productTaxed(p)}});

  return {lines,full:round2(lines.reduce((a,l)=>a+l.qty*l.list,0)),sub,disc,tax:round2(tax),total:round2(sub-disc+tax),items:lines.reduce((a,l)=>a+l.qty,0)}
}

function ctxSub(ctx){if(ctx==='draft')return computeOrder(marketSaleDraft,saleAdj).sub;return round2(orderLines(ctx).reduce((a,x)=>a+num(x.qty)*num(x.price),0))}

// ---- File reading: .xlsx (own small reader, no library) and .csv ----
const xmlEls=(n,tag)=>Array.from(n.getElementsByTagNameNS('*',tag));
async function unzipEntries(buf,want){
  let dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength),eocd=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--)if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('notzip');

  for(let k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('badzip');
    let method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true),loc=dv.getUint32(p+42,true);
    let name=dec.decode(buf.subarray(p+46,p+46+nlen));p+=46+nlen+elen+clen;
    if(!want(name))continue;
    let start=loc+30+dv.getUint16(loc+26,true)+dv.getUint16(loc+28,true),raw=buf.subarray(start,start+csize),bytes;
    if(method===0)bytes=raw;
    else if(method===8){if(typeof DecompressionStream==='undefined')throw new Error('nodecomp');bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
    else throw new Error('method');
