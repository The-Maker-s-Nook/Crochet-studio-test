# Builds the Android test app (APK) on GitHub whenever the app-wrap branch changes.
# The APK appears under this run's "Artifacts" as makers-nook-android-test.
name: Android test app

on:
  push:
    branches: [app-wrap]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the app wrapper (Capacitor)
        run: npm install --no-audit --no-fund

      - name: Copy the web app files
        run: npm run build:www

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#F4A7BC' --splashBackgroundColor '#F3EEFF'

      - name: Version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.24.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Put the web app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "makers-nook-test-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: makers-nook-android-test
          path: makers-nook-test-*.apk
          retention-days: 30
