# Builds the Android test app (APK) on GitHub whenever the app-wrap branch changes.
# Each build is attached to a GitHub release named "Android test build N" (open it on an Android phone and tap the .apk),
# and also kept under this run's "Artifacts".
name: Android test app

on:
  push:
    branches: [app-wrap]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the app wrapper (Capacitor)
        run: npm install --no-audit --no-fund

      - name: Copy the web app files
        run: npm run build:www

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#F4A7BC' --splashBackgroundColor '#F3EEFF'

      - name: Version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.24.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Android 11 or newer (Stripe Tap to Pay needs it)
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 30/' android/variables.gradle
          grep -n minSdkVersion android/variables.gradle

      - name: Put the web app into the Android project
        run: npx cap sync android

      - name: Use the fixed test signing key (so new test builds install over old ones)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // Test builds: always sign with the same test key from android-config/ (never used for Google Play)
          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../android-config/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "makers-nook-test-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: makers-nook-android-test
          path: makers-nook-test-*.apk
          retention-days: 30

      - name: Attach to a release page (easy to download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          printf 'Test version of the app for Android phones. On your phone, tap the .apk file below to download it, then open it to install.\n\nWhat changed: %s\n' "$(printf '%s' "$CHANGE" | head -n 1)" > notes.txt
          gh release create "android-test-${{ github.run_number }}" "makers-nook-test-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --prerelease \
            --title "Android test build ${{ github.run_number }}" --notes-file notes.txt
