# One-off privacy check (QA, Nov 2026): two throwaway accounts on the real Supabase project try to read
# and change each other's data and files; then both are deleted. Prints pass/fail lines only.
name: QA privacy check
on:
  push:
    branches: [qa-privacy-test]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the project's server key (never printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret missing"; exit 1; fi
          keys=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/jrxapujzegvsjgljzxrp/api-keys?reveal=true") || { echo "::error::Could not read project keys (token expired?)"; exit 1; }
          svc=$(echo "$keys" | jq -r '([.[] | select(.name=="service_role")][0].api_key) // ([.[] | select(.type=="secret")][0].api_key) // empty')
          if [ -z "$svc" ]; then echo "::error::No server key found"; exit 1; fi
          echo "::add-mask::$svc"
          echo "SVC=$svc" >> "$GITHUB_ENV"
      - name: Run the privacy check
        run: node qa/privacy-test.mjs
