# Installs the Stripe server function (supabase/functions/stripe) on the Supabase project.
# Runs when that folder changes on app-wrap, or by hand (Actions › Stripe server › Run workflow).
# Needs two repository secrets (Settings › Secrets and variables › Actions), added by the owner, never put in code:
#   SUPABASE_ACCESS_TOKEN - from supabase.com › Account › Access Tokens
#   STRIPE_SECRET_KEY     - the Stripe SANDBOX secret key (starts with sk_test_) while testing
name: Stripe server

on:
  push:
    branches: [app-wrap]
    paths: ['supabase/functions/**', '.github/workflows/stripe-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      PROJECT_REF: jrxapujzegvsjgljzxrp
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are added
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::warning::Skipped: add SUPABASE_ACCESS_TOKEN and STRIPE_SECRET_KEY in the repository's Settings › Secrets and variables › Actions, then run this workflow by hand."
            exit 0
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) echo "Stripe sandbox key found." ;;
            *) echo "::error::This test setup only accepts a Stripe sandbox key (sk_test_...)."; exit 1 ;;
          esac

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.STRIPE_SECRET_KEY != ''
        with:
          version: latest

      - name: Give the server the Stripe key
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.STRIPE_SECRET_KEY != ''
        run: supabase secrets set STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" --project-ref "$PROJECT_REF"

      - name: Install the Stripe function
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.STRIPE_SECRET_KEY != ''
        # The function checks the user's sign-in itself, so Supabase's gateway check is turned off for it.
        run: supabase functions deploy stripe --project-ref "$PROJECT_REF" --no-verify-jwt
