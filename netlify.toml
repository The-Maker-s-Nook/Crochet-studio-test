# Crochet Studio is a ready-made web app. The build step only copies the web files into www/,
# so the phone-app setup files in this project never get published to the website.
[build]
  publish = "www"
  command = "sh scripts/build-www.sh"

# Always check for a fresh copy of the app code, so updates reach phones quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Basic security headers for every page: the app can't be shown inside another site (stops click-jacking),
# browsers don't guess file types, and full page addresses aren't sent to other sites.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
