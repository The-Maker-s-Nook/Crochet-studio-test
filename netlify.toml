# Crochet Studio is a ready-made web app. The build step only copies the web files into www/,
# so the phone-app setup files in this project never get published to the website.
[build]
  publish = "www"
  command = "sh scripts/build-www.sh"

# Always check for a fresh copy of the app code, so updates reach phones quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
