# The Makers Nook is a ready-made web app: no build step.
# Netlify publishes the files in this folder as they are.
[build]
  publish = "."
  command = ""

# Always check for a fresh copy of the app code, so updates reach phones quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Basic security headers for every page: the app can't be shown inside another site (stops click-jacking),
# browsers don't guess file types, and full page addresses aren't sent to other sites.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
